<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reg Hustle</title>
<meta name="description" content="Reg Hustle: build a UK number-plate business. Haggle plates off people, sell to private clients, bid in live auctions, open packs, buy cars and hire them out.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a lock-up yard at night. A HUD strip edged in double yellow lines,
   road-bay tabs, kerb-grey cards, and real UK plates as the hero object.
   Pack opening, auctions' urgency and the cruise scene keep one stage look in both themes. */
:root {
  --bg: #111417;
  --surface: #191e23;
  --raised: #222930;
  --line: #2e3740;
  --ink: #eef1f3;
  --ink-2: #a9b2bb;
  --ink-3: #727d88;
  --hi: #f7c52a;
  --good: #3fd08f;
  --bad: #ff5d55;
  --warn: #ffb020;
  --scrim: rgba(5, 7, 9, .74);
  --shadow: 0 14px 40px rgba(0, 0, 0, .45);
  --r0: #9aa5b1; --r1: #46c98e; --r2: #4f9cff; --r3: #b37dff; --r4: #ffae35; --r5: #ff5280;

  /* physical objects: plates, packs, cars and the stage keep one look in every theme */
  --plate: #f7c52a;
  --plate-ink: #121314;
  --band: #1d47a6;
  --stage: #090b0e;
  --stage-2: #14181d;
  --stage-ink: #f1f3f5;
  --stage-ink-2: #9aa4ae;
  --stage-line: #333c46;
  --s0: #9aa5b1; --s1: #46c98e; --s2: #4f9cff; --s3: #b37dff; --s4: #ffae35; --s5: #ff5280;

  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-plate: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e6e8e3; --surface: #f5f6f2; --raised: #ffffff; --line: #cbd0ca;
    --ink: #14181c; --ink-2: #47505a; --ink-3: #737d87;
    --hi: #8a6400; --good: #15804b; --bad: #c62f28; --warn: #9c6200;
    --scrim: rgba(20, 24, 28, .55); --shadow: 0 10px 30px rgba(20, 24, 28, .14);
    --r0: #626d79; --r1: #16834f; --r2: #1c66d4; --r3: #7537d6; --r4: #b56300; --r5: #cf1446;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e6e8e3; --surface: #f5f6f2; --raised: #ffffff; --line: #cbd0ca;
  --ink: #14181c; --ink-2: #47505a; --ink-3: #737d87;
  --hi: #8a6400; --good: #15804b; --bad: #c62f28; --warn: #9c6200;
  --scrim: rgba(20, 24, 28, .55); --shadow: 0 10px 30px rgba(20, 24, 28, .14);
  --r0: #626d79; --r1: #16834f; --r2: #1c66d4; --r3: #7537d6; --r4: #b56300; --r5: #cf1446;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; }
.muted { color: var(--ink-2); }
.good { color: var(--good); }
.bad { color: var(--bad); }

/* ---------- HUD ---------- */
.app { min-height: 100%; display: flex; flex-direction: column; }
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); padding: 10px 16px 0; }
.hud::after { content: ""; display: block; height: 7px; margin: 10px -16px 0;
  background: linear-gradient(var(--plate), var(--plate)) top / 100% 2px no-repeat, linear-gradient(var(--plate), var(--plate)) bottom / 100% 2px no-repeat; }
.hud-row { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 10px 22px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font: 900 26px/1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; }
.brand b { background: var(--plate); color: var(--plate-ink); padding: 3px 7px 1px; border-radius: 4px; box-shadow: inset 0 0 0 2px rgba(0,0,0,.6); }
.stat { display: grid; gap: 1px; min-width: 0; }
.stat small { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
.stat .v { font: 600 22px/1 var(--f-plate); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .tied { font-size: 11.5px; color: var(--warn); white-space: nowrap; }
.lvl { display: grid; gap: 4px; min-width: 150px; }
.lvl .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.lvl .bar i { display: block; height: 100%; background: var(--plate); border-radius: 3px; }
.hud-sp { flex: 1; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); }
.icon-btn svg { width: 20px; height: 20px; }
.trend { max-width: 1180px; margin: 8px auto 0; display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: baseline; font-size: 13px; color: var(--ink-2); }
.trend b { font-weight: 600; }
.trend .up { color: var(--good); }
.trend .dn { color: var(--bad); }

/* ---------- tabs ---------- */
.tabs { max-width: 1180px; width: 100%; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; }
.tabs button { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 12px 13px 10px; border: 0; background: none; color: var(--ink-2); font-weight: 600; border-bottom: 3px solid transparent; position: relative; }
.tabs button svg { width: 18px; height: 18px; flex: none; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--plate); }
.tabs .dot { margin-left: -2px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--plate); color: var(--plate-ink); font: 700 11px/17px var(--f-body); text-align: center; }
.tabs .dot:empty { display: none; }

main { flex: 1; width: 100%; max-width: 1180px; margin: 0 auto; padding-block: 18px 110px; padding-inline: 16px; }

/* ---------- common bits ---------- */
.btn { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--ink-3); }
.btn.pri { background: var(--plate); color: var(--plate-ink); border-color: transparent; }
.btn.pri:hover:not(:disabled) { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: 13.5px; border-radius: 8px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line); color: var(--ink-2); }
.pill.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.tier { font: 700 10.5px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--tc); border: 1px solid color-mix(in srgb, var(--tc) 55%, transparent); padding: 4px 7px 3px; border-radius: 999px; white-space: nowrap; }
.h { display: flex; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; margin: 28px 0 12px; font: 800 30px/1 var(--f-display); text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.h:first-child { margin-top: 4px; }
.h small { font: 500 14px/1.35 var(--f-body); text-transform: none; color: var(--ink-2); letter-spacing: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; align-items: start; }
.empty { padding: 26px 18px; text-align: center; color: var(--ink-2); border: 1px dashed var(--line); border-radius: 14px; margin: 0; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0; }
.kv dt { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.kv dd { margin: 2px 0 0; font: 600 20px/1.1 var(--f-plate); font-variant-numeric: tabular-nums; }
.kv dd.txt { font: 600 15px/1.3 var(--f-body); }
.kv.three { grid-template-columns: repeat(3, 1fr); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { min-height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--raised); font-weight: 600; font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--plate); color: var(--plate-ink); border-color: transparent; }
.subtabs { margin-bottom: 16px; }
.cd { font-family: var(--f-plate); font-variant-numeric: tabular-nums; }
.intro { display: grid; gap: 10px; padding: 16px; border-radius: 14px; border: 1px solid color-mix(in srgb, var(--plate) 55%, transparent); background: color-mix(in srgb, var(--plate) 8%, var(--surface)); margin-bottom: 14px; }
.intro p { margin: 0; max-width: 70ch; }
.intro b { font-weight: 600; }

/* ---------- plate ---------- */
.plate { container-type: inline-size; width: 100%; }
.pl { position: relative; aspect-ratio: 520 / 111; border-radius: 1.9cqw; display: flex; align-items: center; overflow: hidden;
  background: linear-gradient(180deg, #ffe46e 0%, #f7c52a 46%, #e2aa0b 100%);
  box-shadow: inset 0 0 0 .55cqw rgba(0,0,0,.55), inset 0 .6cqw 0 rgba(255,255,255,.45), 0 .9cqw 2.4cqw rgba(0,0,0,.35); }
.pl.white { background: linear-gradient(180deg, #ffffff 0%, #f3f4ef 46%, #dcdfd8 100%); }
.pl .band { flex: 0 0 9.4%; align-self: stretch; margin: 1.3cqw 0 1.3cqw 1.3cqw; border-radius: 1.2cqw; background: var(--band); color: #fff;
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 1.7cqw; font: 700 4.8cqw/1 var(--f-plate); letter-spacing: .2cqw; }
.pl .tw { flex: 1; min-width: 0; display: flex; justify-content: center; overflow: hidden; padding: 0 1.5cqw 0 .5cqw; }
.pl .txt { display: inline-block; color: var(--plate-ink); font: 600 19.6cqw/1 var(--f-plate); letter-spacing: .5cqw; word-spacing: 3.2cqw; white-space: pre; transform: translateY(.5cqw) scaleX(var(--k, 1)); }
.pl::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.28) 44%, transparent 56%); pointer-events: none; }
.pl .stamp { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-8deg); font: 800 7cqw/1 var(--f-display); letter-spacing: .3cqw; color: #c3201b; border: .8cqw solid #c3201b; padding: 1cqw 2.4cqw .4cqw; border-radius: 1.4cqw; background: rgba(255,255,255,.55); }

/* ---------- people & lot cards ---------- */
.card-b { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.card-b.done { opacity: .62; }
.who { display: flex; gap: 10px; align-items: center; min-width: 0; }
.who > div { min-width: 0; }
.who b { display: block; font-weight: 600; }
.who small { display: block; color: var(--ink-2); font-size: 13px; line-height: 1.3; }
.av { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 800 17px/1 var(--f-display); background: hsl(var(--h) 45% 32%); color: hsl(var(--h) 80% 90%); }
.meta { font-size: 12.5px; color: var(--ink-3); margin-top: -4px; }
.want { margin: 0; color: var(--ink-2); }
.want b { color: var(--ink); font-weight: 600; }
.leave { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }

.lot { box-shadow: inset 0 3px 0 var(--line); }
.lot.win { box-shadow: inset 0 3px 0 var(--good); border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.lot.out { box-shadow: inset 0 3px 0 var(--warn); }
.lot.mine { box-shadow: inset 0 3px 0 var(--plate); }
.lot .clock { font: 700 30px/1 var(--f-plate); font-variant-numeric: tabular-nums; }
.lot.urgent .clock { color: var(--bad); }
.live { display: inline-flex; align-items: center; gap: 6px; font: 700 11px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--bad); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }
.lead { margin: 0; font-weight: 600; font-size: 14px; }
.bids { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; font-size: 12.5px; color: var(--ink-2); min-height: 3.6em; }
.bids li { display: flex; justify-content: space-between; gap: 8px; }
.bids li span:last-child { font-family: var(--f-plate); font-size: 14px; font-variant-numeric: tabular-nums; }
.bids li.you { color: var(--good); }

/* ---------- garage ---------- */
.g-stats { display: flex; gap: 8px 22px; flex-wrap: wrap; margin-bottom: 12px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.chip { min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.sel { min-height: 34px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font-size: 13.5px; }
.own { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 10px; box-shadow: inset 0 3px 0 var(--tc); }
.own:hover { border-color: var(--ink-3); }
.own .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.own .val { font: 600 21px/1 var(--f-plate); font-variant-numeric: tabular-nums; }
.own .sub { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--ink-3); flex-wrap: wrap; }
.flags { display: flex; gap: 6px; flex-wrap: wrap; }
.flags:empty { display: none; }

/* ---------- cars ---------- */
.cars { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; align-items: start; }
.car-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.car-card .stage-wrap { background: radial-gradient(90% 70% at 50% 100%, color-mix(in srgb, var(--g) 18%, transparent), transparent 70%); border-radius: 12px; padding: 6px 4px 0; }
.car-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.car-h b { display: block; font: 800 22px/1 var(--f-display); text-transform: uppercase; }
.car-h small { display: block; color: var(--ink-2); font-size: 13px; margin-top: 3px; }
.prest { display: inline-flex; gap: 2px; padding-top: 6px; flex: none; }
.prest i { width: 8px; height: 4px; border-radius: 2px; background: var(--line); }
.prest i.on { background: var(--plate); }
.car-stage { position: relative; width: 100%; aspect-ratio: 400 / 130; perspective: 520px; isolation: isolate; }
.car-stage svg.car { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.car-plate { position: absolute; width: 17%; transform: translate(-50%, -50%) rotateY(34deg); transform-style: preserve-3d; }
.car-plate .pl { box-shadow: 0 .5cqw 0 #8b8e88, 0 3cqw 4cqw -1cqw rgba(0,0,0,.55); }
.price { font: 600 24px/1 var(--f-plate); font-variant-numeric: tabular-nums; }
.prog { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--good); border-radius: 3px; transition: width 1s linear; }

/* ---------- packs ---------- */
.packs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; align-items: start; }
.pack-tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; justify-items: center; text-align: center; }
.pack-tile h3 { margin: 0; font: 800 24px/1 var(--f-display); text-transform: uppercase; }
.pack-tile p { margin: 0; color: var(--ink-2); font-size: 13.5px; max-width: 34ch; }
.odds { width: 100%; text-align: left; font-size: 12.5px; }
.odds summary { cursor: pointer; color: var(--ink-2); font-weight: 600; list-style: none; text-align: center; }
.odds summary::-webkit-details-marker { display: none; }
.odds table { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
.odds td { padding: 3px 0; border-bottom: 1px solid var(--line); }
.odds td:last-child { text-align: right; font-family: var(--f-plate); font-size: 14px; }
.pack { --w: 170px; width: var(--w); aspect-ratio: 5 / 8; border-radius: 14px; position: relative; overflow: hidden; display: flex; flex-direction: column;
  background: var(--pk-bg); color: var(--pk-ink); box-shadow: 0 16px 34px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.12); border: 0; padding: 0; font: inherit; }
.pack .crimp { flex: 0 0 9%; background: repeating-linear-gradient(90deg, rgba(255,255,255,.2) 0 2px, rgba(0,0,0,.12) 2px 5px), var(--pk-crimp); }
.pack .body { flex: 1; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 12% 10% 10%; gap: 8px; }
.pack .kick { font: 700 11px/1 var(--f-body); letter-spacing: .16em; text-transform: uppercase; opacity: .85; }
.pack .nm { font: 900 calc(var(--w) * .2)/.86 var(--f-display); text-transform: uppercase; text-align: center; letter-spacing: .01em; }
.pack .mini { width: 92%; }
.pack .stripe { width: 100%; height: 8px; background: var(--pk-stripe); border-radius: 2px; }
.pack::after { content: ""; position: absolute; inset: -40%; background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.22) 48%, transparent 56%); transform: translateX(-30%); transition: transform .8s ease; pointer-events: none; }
.pack-tile:hover .pack::after, .pack:hover::after { transform: translateX(30%); }
.pack .free { position: absolute; top: 14%; right: -30%; transform: rotate(35deg); width: 100%; text-align: center; background: var(--plate); color: var(--plate-ink); font: 800 13px/1 var(--f-display); letter-spacing: .1em; padding: 5px 0 3px; }
.art-street { --pk-bg: linear-gradient(180deg, #1c1f23, #0f1114); --pk-ink: #f7c52a; --pk-crimp: #f7c52a; --pk-stripe: repeating-linear-gradient(-45deg, #f7c52a 0 9px, #111 9px 18px); }
.art-classic { --pk-bg: linear-gradient(170deg, #145140, #0a2a20 70%); --pk-ink: #efe4c3; --pk-crimp: #c9a24a; --pk-stripe: linear-gradient(90deg, #c9a24a, #efe4c3, #c9a24a); }
.art-custom { --pk-bg: linear-gradient(160deg, #eef1f5 0%, #9aa3b0 40%, #e2e6ec 62%, #7f8896 100%); --pk-ink: #10141a; --pk-crimp: #4f9cff; --pk-stripe: linear-gradient(90deg, #4f9cff, #b37dff); }
.art-dateless { --pk-bg: radial-gradient(120% 80% at 50% 0%, #1c3270, #070f26 70%); --pk-ink: #e9c66a; --pk-crimp: #e9c66a; --pk-stripe: linear-gradient(90deg, #8a6a20, #f2d68a, #8a6a20); }
.art-crate { --pk-bg: conic-gradient(from 210deg at 50% 60%, #1a0b16, #3a0d24, #12091a, #2a0b30, #1a0b16); --pk-ink: #fff; --pk-crimp: #ff5280; --pk-stripe: linear-gradient(90deg, #ff5280, #ffae35, #b37dff, #4f9cff, #ff5280); }

/* ---------- studio ---------- */
.studio { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.panel h3 { margin: 0; font: 800 22px/1 var(--f-display); text-transform: uppercase; }
.field { display: grid; gap: 6px; }
.field label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.field input { min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); padding: 0 14px; font: 600 26px/1 var(--f-plate); letter-spacing: .08em; text-transform: uppercase; width: 100%; }
.field input[aria-invalid="true"] { border-color: var(--bad); }
.hint { margin: 0; font-size: 13px; color: var(--ink-2); }
.hint.err { color: var(--bad); }
.tags { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.tags li { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; padding: 6px 0; border-bottom: 1px solid var(--line); }

/* ---------- upgrades, profile ---------- */
.kit { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; align-items: start; }
.upg { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }

.lv i { width: 22px; height: 6px; border-radius: 2px; background: var(--line); }
.lv i.on { background: var(--plate); }
.rank { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; padding: 18px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }

.rank h3 { margin: 0; font: 900 32px/1 var(--f-display); text-transform: uppercase; }
.rank p { margin: 4px 0 8px; color: var(--ink-2); font-size: 13.5px; }
.rank .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.rank .bar i { display: block; height: 100%; background: var(--plate); }
.sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.set { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; gap: 4px; }
.set b { font-weight: 600; }
.set small { color: var(--ink-2); font-size: 13px; }
.set .rw { font: 600 14px/1 var(--f-plate); color: var(--ink-3); }
.set.got { border-color: color-mix(in srgb, var(--good) 50%, var(--line)); }
.set.got .rw { color: var(--good); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.ledger { list-style: none; margin: 0; padding: 0; max-height: 440px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.ledger li { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.ledger li:last-child { border-bottom: 0; }
.ledger small { color: var(--ink-3); }
.ledger .a { font-family: var(--f-plate); font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lines { list-style: none; margin: 0; padding: 0; display: grid; }
.lines li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.lines li span:last-child { font-family: var(--f-plate); font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.howto { margin: 0; padding-left: 20px; display: grid; gap: 8px; color: var(--ink-2); max-width: 65ch; }
.howto b { color: var(--ink); font-weight: 600; }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: grid; place-items: center; padding: 16px; }
.sheet { position: relative; width: min(560px, 100%); max-height: calc(100% - 16px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: var(--shadow); display: grid; gap: 16px; animation: rise .25s ease; }
@keyframes rise { from { transform: translateY(14px); opacity: .4; } }
.sheet h2 { margin: 0; font: 800 28px/1 var(--f-display); text-transform: uppercase; padding-right: 40px; text-wrap: balance; }
.sheet .x { position: absolute; top: 12px; right: 12px; }
.say { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); font-size: 15px; }
.say.good { border-color: color-mix(in srgb, var(--good) 55%, transparent); }
.say.bad { border-color: color-mix(in srgb, var(--bad) 55%, transparent); }
.say.warn { border-color: color-mix(in srgb, var(--warn) 55%, transparent); }
.pips { display: inline-flex; gap: 4px; vertical-align: middle; }
.pips i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.pips i.on { background: var(--warn); }
.offer { display: grid; gap: 8px; }
.offer label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.money { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); padding-left: 14px; }
.money span { font: 600 26px/1 var(--f-plate); color: var(--ink-3); }
.money input { flex: 1; min-width: 0; border: 0; background: none; min-height: 50px; padding: 0 10px; font: 600 28px/1 var(--f-plate); font-variant-numeric: tabular-nums; }
.money input:focus { outline: none; }
.money:focus-within { outline: 2px solid var(--hi); outline-offset: 2px; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.fine { margin: 0; font-size: 12.5px; color: var(--ink-3); }
.picks { display: grid; gap: 8px; }
.pick { display: grid; grid-template-columns: minmax(0, 150px) 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--raised); }
.pick:hover:not(:disabled) { border-color: var(--ink-3); }
.pick:disabled { opacity: .5; cursor: not-allowed; }
.pick b { font: 600 18px/1.1 var(--f-plate); }
.pick small { display: block; color: var(--ink-2); font-size: 12.5px; }
.pick.carpick { grid-template-columns: minmax(0, 180px) 1fr auto; }
.toggle-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

/* ---------- pack stage ---------- */
.ov { position: fixed; inset: 0; z-index: 60; background: radial-gradient(120% 90% at 50% 30%, var(--stage-2), var(--stage) 70%); color: var(--stage-ink); display: grid; grid-template-rows: auto 1fr auto; overflow: auto; }
.ov canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.ov-top { padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 0; text-align: center; display: grid; gap: 4px; }
.ov-top b { font: 900 34px/1 var(--f-display); text-transform: uppercase; }
.ov-top span { color: var(--stage-ink-2); font-size: 14px; }
.ov-mid { display: grid; place-items: center; padding: 20px 16px; min-height: 0; }
.ov .pack { --w: min(240px, 58vw); cursor: pointer; animation: hover 2.4s ease-in-out infinite; }
@keyframes hover { 50% { transform: translateY(-8px) rotate(-1deg); } }
.ov .pack.tear { animation: shake .5s ease; }
.ov .pack.tear .crimp:first-child { animation: rip .55s ease-in forwards; }
.ov .pack.gone { animation: drop .45s ease-in forwards; }
@keyframes shake { 20% { transform: rotate(-4deg); } 40% { transform: rotate(4deg); } 60% { transform: rotate(-3deg); } 80% { transform: rotate(2deg); } }
@keyframes rip { to { transform: translate(40%, -260%) rotate(24deg); opacity: 0; } }
@keyframes drop { to { transform: translateY(70%) scale(.85); opacity: 0; } }
.cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; max-width: 900px; }
.card { width: clamp(138px, 27vw, 188px); aspect-ratio: 5 / 7; perspective: 1000px; background: none; border: 0; padding: 0; animation: dealIn .5s cubic-bezier(.2,.9,.3,1.2) backwards; }
@keyframes dealIn { from { transform: translateY(60px) scale(.85) rotate(-6deg); opacity: 0; } }
.card .ci { display: block; position: relative; width: 100%; height: 100%; transition: transform .75s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; }
.card.flipped .ci { transform: rotateY(180deg); }
.card .face { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
.card .back { background: repeating-linear-gradient(-45deg, #f7c52a 0 12px, #16181b 12px 24px); box-shadow: inset 0 0 0 6px #16181b, 0 10px 24px rgba(0,0,0,.5); display: grid; place-items: center; }
.card .back span { background: #16181b; color: #f7c52a; font: 900 28px/1 var(--f-display); padding: 10px 12px 6px; border-radius: 8px; letter-spacing: .04em; }
.card.tease .back { box-shadow: inset 0 0 0 6px #16181b, 0 0 0 2px var(--tc), 0 0 38px var(--tc); animation: tease 1.1s ease-in-out infinite; }
@keyframes tease { 50% { box-shadow: inset 0 0 0 6px #16181b, 0 0 0 3px var(--tc), 0 0 64px var(--tc); } }
.card .front { transform: rotateY(180deg); background: linear-gradient(180deg, #1b2026, #111418); border: 2px solid var(--tc); box-shadow: 0 0 34px color-mix(in srgb, var(--tc) 55%, transparent); display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; padding: 12px; text-align: left; color: var(--stage-ink); }
.card .front .tier { align-self: flex-start; }
.card .front .cv { font: 600 26px/1 var(--f-plate); font-variant-numeric: tabular-nums; }
.card .front small { color: var(--stage-ink-2); font-size: 11.5px; line-height: 1.35; }
.card.myth .front { background: linear-gradient(180deg, #2a0f1f, #120a12); animation: holo 3s linear infinite; }
@keyframes holo { 0% { border-color: #ff5280; } 33% { border-color: #ffae35; } 66% { border-color: #4f9cff; } 100% { border-color: #ff5280; } }
.ov-bot { padding: 0 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; justify-items: center; text-align: center; }
.ov-bot .sum { font-size: 15px; color: var(--stage-ink-2); margin: 0; }
.ov-bot .sum b { color: var(--stage-ink); font: 600 22px/1 var(--f-plate); }
.ov .btn, .ride .btn { background: #232a31; border-color: #3a434d; color: var(--stage-ink); }
.ov .btn.pri, .ride .btn.pri { background: var(--plate); color: var(--plate-ink); border-color: transparent; }
.flash { position: fixed; inset: 0; z-index: 3; pointer-events: none; background: var(--tc); opacity: 0; }
.flash.go { animation: flash .7s ease-out; }
@keyframes flash { 0% { opacity: .55; } 100% { opacity: 0; } }

/* ---------- cruise scene ---------- */
.ride { position: fixed; inset: 0; z-index: 65; overflow: hidden; background: #05070d; color: var(--stage-ink); animation: fadein .5s ease; }
@keyframes fadein { from { opacity: 0; } }
.ride.night { --sky1: #04060c; --sky2: #1d2546; --road: #0b0d13; --lane: #d9cfae; --beam: .75; }
.ride.day { --sky1: #86b4e4; --sky2: #f3e3cb; --road: #3e434e; --lane: #f3f0e6; --beam: 0; }
.scene { position: absolute; inset: 0; overflow: hidden; }
.scene .sky { position: absolute; inset: 0; background: linear-gradient(180deg, var(--sky1), var(--sky2) 78%); }
.scene .orb { position: absolute; right: 13%; top: 11%; width: clamp(54px, 9vw, 96px); aspect-ratio: 1; border-radius: 50%; }
.ride.night .orb { background: radial-gradient(circle at 38% 36%, #fbf8ef, #cfd6e6 70%); box-shadow: 0 0 60px 14px rgba(210, 222, 255, .18); }
.ride.day .orb { background: radial-gradient(circle, #fff8e0, #ffd98a 70%); box-shadow: 0 0 90px 30px rgba(255, 214, 140, .45); }
.scene .stars { position: absolute; inset: 0 0 45% 0; opacity: 0; background-image:
  radial-gradient(1.2px 1.2px at 8% 18%, #fff, transparent), radial-gradient(1px 1px at 22% 42%, #fff, transparent),
  radial-gradient(1.4px 1.4px at 36% 12%, #fff, transparent), radial-gradient(1px 1px at 52% 30%, #fff, transparent),
  radial-gradient(1.2px 1.2px at 64% 8%, #fff, transparent), radial-gradient(1px 1px at 74% 36%, #fff, transparent),
  radial-gradient(1.3px 1.3px at 90% 22%, #fff, transparent), radial-gradient(1px 1px at 46% 52%, #fff, transparent); }
.ride.night .stars { opacity: .75; }
.scene .sk { position: absolute; left: 0; bottom: 20%; background-repeat: repeat-x; background-size: auto 100%; background-position: 0 100%; will-change: transform; }
.scene .sk.far { height: 50%; opacity: .95; }
.scene .sk.mid { height: 38%; }
.scene .sk.near { height: 22%; }
.scene .road { position: absolute; left: 0; right: 0; bottom: 0; height: 20.5%; background: linear-gradient(180deg, #6b7079 0 3px, var(--road) 3px); }
.scene .dash { position: absolute; left: 0; top: 44%; height: 4px; background: repeating-linear-gradient(90deg, var(--lane) 0 70px, transparent 70px 160px); opacity: .55; will-change: transform; }
.ride-car { position: absolute; left: 50%; bottom: 8.5%; width: min(700px, 96vw); transform: translateX(-50%); animation: drivein 1.6s cubic-bezier(.16,.84,.3,1) both; }
@keyframes drivein { from { transform: translateX(calc(-50% - 85vw)); } }
.ride-car .car-stage { animation: bob 1s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-1.5px); } }
.ride-car .beam { position: absolute; right: -34%; bottom: 20%; width: 48%; height: 30%; pointer-events: none; opacity: var(--beam);
  background: linear-gradient(90deg, rgba(255, 240, 205, .38), transparent); clip-path: polygon(0 42%, 100% 0, 100% 100%, 0 58%); }
.ride-x { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; z-index: 3; background: rgba(20, 24, 29, .6); border-color: var(--stage-line); color: var(--stage-ink); }
.ride-card { position: absolute; left: 50%; top: max(calc(20px + env(safe-area-inset-top, 0px)), 6vh); z-index: 2; transform: translateX(-50%);
  width: min(440px, calc(100vw - 32px)); padding: 20px; border-radius: 18px; background: rgba(16, 19, 24, .9); border: 1px solid var(--stage-line);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); box-shadow: 0 30px 70px -30px rgba(0,0,0,.7), 0 0 0 1px color-mix(in srgb, var(--g) 30%, transparent);
  animation: cardin .6s cubic-bezier(.2,.8,.2,1) both; display: grid; gap: 10px; }
@keyframes cardin { from { opacity: 0; transform: translate(-50%, 14px); } }
.ride-card .rk { display: inline-flex; align-items: center; gap: 8px; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; color: var(--g); }
.ride-card .rk i { width: 7px; height: 7px; border-radius: 50%; background: var(--g); box-shadow: 0 0 10px var(--g); }
.ride-card h3 { margin: 0; font: 800 26px/1.05 var(--f-display); text-transform: uppercase; text-wrap: balance; }
.ride-card p { margin: 0; font-size: 14.5px; color: var(--stage-ink-2); }
.ride-card .rr { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-top: 12px; border-top: 1px solid var(--stage-line); font-size: 12.5px; color: var(--stage-ink-2); }
.ride-card .rr b { font: 600 22px/1 var(--f-plate); color: var(--g); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- toast ---------- */
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); z-index: 80; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

  .studio, .cols { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .hud { padding-top: 8px; position: relative; top: 0; }
  .hud-row { gap: 8px 16px; }
  .brand { font-size: 22px; order: 1; flex: 1 1 calc(100% - 60px); }
  .gear { order: 2; margin-left: auto; width: 36px; height: 36px; }
  .hud-row > .stat { order: 3; }
  .stat .v { font-size: 19px; }
  .lvl { min-width: 0; flex: 1 1 100%; order: 5; }
  .hud-sp { display: none; }
  .trend { margin-top: 6px; font-size: 12.5px; }

  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; max-width: none; padding: 0 2px env(safe-area-inset-bottom, 0px); background: var(--surface); border-top: 1px solid var(--line); justify-content: space-around; gap: 0; }
  .tabs button { flex: 1 1 0; flex-direction: column; gap: 3px; padding: 9px 1px 8px; font-size: 11px; border-bottom: 0; border-top: 3px solid transparent; min-width: 0; }
  .tabs button[aria-selected="true"] { border-top-color: var(--plate); }
  .tabs .dot { position: absolute; top: 4px; right: calc(50% - 22px); margin: 0; }
  .h { font-size: 26px; }
  .kv.three { grid-template-columns: 1fr 1fr; }
  .pick, .pick.carpick { grid-template-columns: minmax(0, 130px) 1fr; }
  .pick > :last-child { grid-column: 1 / -1; justify-self: start; }
  .sheet { padding: 16px; }
  .cars { grid-template-columns: minmax(0, 1fr); }
  .ride-card { top: calc(64px + env(safe-area-inset-top, 0px)); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

(() => {
'use strict';

/* ================================================================
   Utilities
   ================================================================ */
const $ = (s, r = document) => r.querySelector(s);

function parse(raw) {
  const t = String(raw || '').toUpperCase().replace(/\s+/g, ' ').trim();
  let m;
  if ((m = t.match(/^([A-Z])([A-Z])(\d\d) ([A-Z]{3})$/))) {
    if (!AREA1.includes(m[1]) || !AREA2.includes(m[2]) || !AGES.includes(m[3]) || /Q/.test(m[4])) return null;
    return { f: 'cur', a: m[1] + m[2], age: m[3], r: m[4], t };
  }
  if ((m = t.match(/^([A-Z])(\d{1,3}) ([A-Z]{3})$/))) {
    if (!PRE_YEAR[m[1]] || m[2][0] === '0' || /Q/.test(m[3])) return null;
    return { f: 'pre', y: m[1], n: m[2], r: m[3], t };
  }
  if ((m = t.match(/^([A-Z]{3}) (\d{1,3})([A-Z])$/))) {
    if (!SUF_YEAR[m[3]] || m[2][0] === '0' || /Q/.test(m[1])) return null;
    return { f: 'suf', r: m[1], n: m[2], y: m[3], t };
  }
  if ((m = t.match(/^([A-Z]{1,3}) (\d{1,4})$/))) {
    if (m[2][0] === '0' || /Q/.test(m[1])) return null;
    return { f: 'dl', l: m[1], n: m[2], nf: false, t };
  }
  if ((m = t.match(/^(\d{1,4}) ([A-Z]{1,3})$/))) {
    if (m[1][0] === '0' || /Q/.test(m[2])) return null;
    return { f: 'dl', l: m[2], n: m[1], nf: true, t };
  }
  return null;
}

const FORMAT_NAME = { cur: 'Current', pre: 'Prefix', suf: 'Suffix', dl: 'Dateless' };
function describe(p) {
  if (p.f === 'cur') {

    return { fmt: 'Current', when, where: AREA_NAME[p.a[0]] };
  }
  if (p.f === 'pre') return { fmt: 'Prefix', when: String(PRE_YEAR[p.y]) };
  if (p.f === 'suf') return { fmt: 'Suffix', when: String(SUF_YEAR[p.y]) };
  return { fmt: 'Dateless', when: 'pre-1963' };
}

const TIERS = [

const tierOf = v => { let i = 0; TIERS.forEach((t, k) => { if (v >= t.min) i = k; }); return i; };
const isTriple = s => s.length === 3 && s[0] === s[1] && s[1] === s[2];
const isRun = s => s.charCodeAt(1) === s.charCodeAt(0) + 1 && s.charCodeAt(2) === s.charCodeAt(1) + 1;
const isRep = n => n.length >= 2 && /^(\d)\1+$/.test(n);

/* The appraisal is the hidden truth behind every plate. */
const AP = new Map();
function appraise(raw) {
  const p = parse(raw);
  if (!p) return null;
  if (AP.has(p.t)) return AP.get(p.t);
  const tags = [];
  const add = (l, m, c) => tags.push({ l, m, c });
  let base, baseL;
  if (p.f === 'cur') {
    base = 80; baseL = 'Current-style plate';
    const r = p.r, fw = decode(p.a + p.age).find(w => WORDS4.has(w) || NAMES4.has(w));
    const rN = NAMES3.has(r), rW = WORDS3.has(r);
    if (fw) {
      add(`Spells ${fw}`, 14, NAMES4.has(fw) ? 'names' : 'words');
      if (rN || rW) add(`Reads “${fw} ${r}”`, 3, 'words');
    } else {
      if (p.age === '51' || p.age === '02') add('First-issue age identifier', 1.3, 'pattern');
      if (p.age[0] === p.age[1]) add(`Matching age ${p.age}`, 1.4, 'pattern');
    }
    if (p.a[0] === p.a[1]) add(`Double area code ${p.a}`, 1.4, 'pattern');
    if (isTriple(r)) add(`Triple letters ${r}`, 3.5, 'pattern');
    else if (isRun(r)) add(`Letter run ${r}`, 2, 'pattern');
    else if (!fw && (rN || rW)) add(`${rN ? 'Name' : 'Word'}: ${r}`, 2.2, rN ? 'names' : 'words');
    else if (r[0] === r[1] || r[1] === r[2]) add('Letter pair', 1.2, 'pattern');
    if (r.startsWith(p.a)) add(`Echoes ${p.a}`, 1.3, 'pattern');
  } else if (p.f === 'pre') {
    base = 140; baseL = 'Prefix plate';
    const w = decode(p.y + p.n + p.r).find(x => NAMESL.has(x) || WORDSL.has(x));
    if (w) add(`Spells ${w}`, 20, NAMESL.has(w) ? 'names' : 'words');
    if (p.n === '1') add('Number 1', 4, 'low');
    else if (p.n.length === 1) add(`Single digit ${p.n}`, 2, 'low');
    else if (isRep(p.n)) add(`Repeating ${p.n}`, 1.6, 'pattern');
    if (!w) {
      if (isTriple(p.r)) add(`Triple letters ${p.r}`, 3, 'pattern');
      else if (NAMES3.has(p.r)) add(`Name: ${p.r}`, 2, 'names');
      else if (WORDS3.has(p.r)) add(`Word: ${p.r}`, 2, 'words');
    }
  } else if (p.f === 'suf') {
    base = 180; baseL = 'Suffix plate';
    if (p.n === '1') add('Number 1', 3, 'low');
    else if (p.n.length === 1) add(`Single digit ${p.n}`, 1.6, 'low');
    else if (isRep(p.n)) add(`Repeating ${p.n}`, 1.4, 'pattern');
    if (isTriple(p.r)) add(`Triple letters ${p.r}`, 3, 'pattern');
    else if (NAMES3.has(p.r)) add(`Name: ${p.r}`, 3, 'names');
    else if (WORDS3.has(p.r)) add(`Word: ${p.r}`, 2.5, 'words');
  } else {
    const len = p.l.length + p.n.length;
    base = DL_BASE[len]; baseL = `Dateless, ${len} characters`;
    if (p.n === '1') add('Number 1', 2.5, 'low');
    else if (p.n === '7') add('Lucky 7', 1.8, 'low');
    else if (p.n.length === 1) add(`Single digit ${p.n}`, 1.4, 'low');
    if (isRep(p.n)) add(`Repeating ${p.n}`, 1.5, 'pattern');
    else if (/^[1-9]0+$/.test(p.n)) add(`Round number ${p.n}`, 1.3, 'pattern');
    if (NAMES3.has(p.l)) add(`Name: ${p.l}`, 4, 'names');
    else if (WORDS3.has(p.l)) add(`Word: ${p.l}`, 3, 'words');
    else if (p.l.length === 2 && p.l[0] === p.l[1]) add(`Double letters ${p.l}`, 1.4, 'pattern');
    else if (isTriple(p.l)) add(`Triple letters ${p.l}`, 2, 'pattern');
    if (p.nf) add('Number comes first', .85, null);
  }
  const noise = .85 + .3 * mulberry32(hash(p.t))();
  const v = Math.min(2e6, Math.max(20, Math.round(base * tags.reduce((x, g) => x * g.m, 1) * noise)));
  const fc = { cur: 'current', pre: 'classic', suf: 'classic', dl: 'dateless' }[p.f];
  const cats = new Set([fc, ...tags.filter(g => g.c).map(g => g.c)]);
  const a = { t: p.t, p, base, baseL, noise, tags, v, tier: tierOf(v), cats, custom: p.f === 'dl' || cats.has('names') || cats.has('words') };
  AP.set(p.t, a);
  return a;
}

const r3 = () => pick(RL) + pick(RL) + pick(RL);

const POOLS = {
  normal: { curRand: 5, curPat: 3, preRand: 3, preLow: 1.5, sufRand: 2, sufLow: 1 },
  custom: { curWord: 3, preName: 3, sufName: 2, dlName: 2, curPat: 1, dl4: .6, dl3: .3, dl2: .15 },
  classic: { preRand: 3, preLow: 2, sufRand: 3, sufLow: 2, preName: .5, sufName: 1, dl7: 1, dl6: 1, dl5: .6 },
  dateless: { dl7: 1, dl6: 2, dl5: 2, dl4: 2, dl3: 1.5, dl2: .6, dlName: 1.5 },
  street: { curRand: 6, curPat: 3, curWord: 1, preRand: 4, preLow: 1.5, preName: .8, sufRand: 3, sufLow: 1, sufName: 1, dl7: 1, dl6: 1, dl5: .7, dl4: .4, dl3: .2, dlName: .4, dl2: .05 },

/* Roll a plate of an exact tier from a pool; the appraisal decides the tier. */
function rollPlate(pool, tier, ex) {
  const kinds = Object.keys(POOLS[pool]), ws = kinds.map(k => POOLS[pool][k]);
  let best = null, bd = 99;
  for (let i = 0; i < 900; i++) {
    const t = GEN[wpick(kinds, ws)]();
    const a = appraise(t);
    if (!a || (ex && ex.has(a.t))) continue;
    if (a.tier === tier) return a.t;
    const d = Math.abs(a.tier - tier);
    if (d < bd) { bd = d; best = a.t; }
  }
  return best;
}

const trendMult = a => {
  if (!S || !S.trend || !a) return 1;
  let m = 1;
  if (a.cats.has(S.trend.hot)) m *= S.trend.hm;
  if (a.cats.has(S.trend.cold)) m *= S.trend.cm;
  return m;
};
const mv = t => { const a = appraise(t); return a ? Math.round(a.v * trendMult(a)) : 0; };
function newTrend() {
  const h = pick(TREND_CATS); let c; do { c = pick(TREND_CATS); } while (c.k === h.k);
  S.trend = { hot: h.k, hm: +rand(1.15, 1.5).toFixed(2), cold: c.k, cm: +rand(.7, .9).toFixed(2), until: NOW() + TREND_MS, seed: ri(1, 1e9) };
}
const skew = (ws, f) => ws.map((w, i) => w * f ** i);

function newSeller(opt = {}) {
  const ex = ownedSet(), used = new Set(S.sellers.map(s => s.n));
  const types = Object.keys(SELLER_TYPES);
  const type = opt.type || wpick(types, types.map(k => SELLER_TYPES[k].w)), T = SELLER_TYPES[type];
  let tier = wpick([0, 1, 2, 3, 4, 5], skew(T.tiers, 1 + .08 * level()));
  if (opt.boost) tier = Math.min(5, tier + 1);
  const t = rollPlate('street', tier, ex);
  let per = PERSONAS[type].filter(x => !used.has(x.n)); if (!per.length) per = PERSONAS[type];
  const who = pick(per), a = appraise(t), m = mv(t), tg = S.upg.tongue ? .95 : 1;
  const dodgy = Math.random() < T.dodgy;
  let ask, reserve;
  if (type === 'clueless') { ask = a.v * rand(.35, .9); reserve = ask * rand(.55, .8); }
  else if (type === 'average') { ask = m * rand(.9, 1.3); reserve = m * rand(.75, 1); }
  else if (type === 'shark') { ask = m * rand(1.2, 1.8); reserve = m * rand(1, 1.25); }
  else { ask = m * rand(.3, .6); reserve = ask * rand(.6, .8); }
  ask = roundNice(ask); reserve = Math.min(ask, roundNice(reserve * tg));
  const err = EYE_ERR[S.upg.eye], c = m * (1 + clamp(gauss() * err * .35, -err * .8, err * .8));
  const pat = (type === 'clueless' ? ri(3, 4) : ri(2, 3)) + (S.upg.tongue ? 1 : 0);
  return { id: nid(), type, n: who.n, r: who.r, hue: ri(0, 359), t, ask, reserve, counter: ask, pat, maxPat: pat, dodgy, check: null,
    est: [roundNice(c * (1 - err)), roundNice(c * (1 + err))], state: 'open', msg: who.l, mood: '', paid: 0, until: NOW() + ri(180, 360) * 1000 };
}
function newClient() {
  const used = new Set(S.clients.map(c => c.n));
  let ppl = CLIENT_PEOPLE.filter(x => !used.has(x.n)); if (!ppl.length) ppl = CLIENT_PEOPLE;
  const who = pick(ppl), want = wpick(WANTS, WANTS.map(w => w.w));
  let budget = wpick([500, 1500, 4000, 12000, 40000, 150000, 600000], skew([24, 26, 20, 14, 9, 5, 2], 1 + .1 * level()));
  if (want.k === 'tier') budget = Math.max(budget, TIERS[want.min].min * 3);
  if (want.cat === 'dateless') budget = Math.max(budget, 4000);
  const pm = want.k === 'any' ? rand(.55, .85) : rand(.95, 1.45);
  const pat = ri(2, 3) + (S.upg.tongue ? 1 : 0);
  return { id: nid(), n: who.n, r: who.r, hue: ri(0, 359), want, budget, pm: +pm.toFixed(2), pat, state: 'open', deal: null, sold: null, until: NOW() + ri(240, 480) * 1000 };
}
const bidInc = v => v < 100 ? 5 : v < 500 ? 10 : v < 1000 ? 25 : v < 5000 ? 50 : v < 10000 ? 100 : v < 50000 ? 500 : v < 100000 ? 1000 : 5000;
function makeBidders(m, k) {
  const used = new Set();
  return Array.from({ length: k }, () => {
    let n; do { n = `${pick(['Paddle', 'Phone bidder', 'Online bidder', 'Room bidder'])} ${ri(2, 99)}`; } while (used.has(n));

function newLot() {

function newJob(opt = {}) {
  const L = level(), best = Math.max(1, ...S.cars.map(c => carModel(c.m).prest));

const mark = (...k) => k.forEach(x => UI.dirty.add(x));

/* ---------- live auctions ---------- */

}

  const left = lot.ends - NOW(), next = nextBid(lot);

  if (!cands.length) return false;

}

/* ---------- hire jobs ---------- */

/* ---------- the tick ---------- */
function tick() {
  if (!S) return;
  const t = NOW();
  if (t >= S.trend.until) { newTrend(); mark('all'); toast(`Market moved: ${TREND_CATS.find(c => c.k === S.trend.hot).l} are up.`); }
  const keep = (arr, type, k) => arr.filter(x => {
    if (x.state === 'open' && t > x.until && activeId(type) !== x.id) { mark(k); return false; }
    if (x.state !== 'open' && x.state !== 'active' && t > (x.doneAt || x.until) + 15000 && activeId(type) !== x.id) { mark(k); return false; }
    return true;
  });
  S.sellers = keep(S.sellers, 'buy', 'deals');
  S.clients = keep(S.clients, 'sell', 'deals').filter(c => c.state !== 'open' || t <= c.until || activeId('sellPick') === c.id || activeId('sell') === c.id);
  S.jobs = keep(S.jobs, 'jobPick', 'jobs');
  if (t >= S.spawn.seller) { if (S.sellers.filter(s => s.state === 'open').length < sellerCap()) S.sellers.push(newSeller()); S.spawn.seller = t + ri(30, 60) * 1000; mark('deals'); }
  if (t >= S.spawn.client) { if (S.clients.filter(c => c.state === 'open').length < clientCap()) S.clients.push(newClient()); S.spawn.client = t + ri(45, 90) * 1000; mark('deals'); }
  if (t >= S.spawn.job) { if (S.jobs.filter(j => j.state === 'open').length < jobCap()) S.jobs.push(newJob()); S.spawn.job = t + ri(50, 110) * 1000; mark('jobs'); }
  if (t >= S.spawn.lot) { if (S.lots.filter(l => !l.done && !l.mine).length < lotCap()) { S.lots.push(newLot()); mark('auctions'); } S.spawn.lot = t + ri(8, 20) * 1000; }
  for (const lot of S.lots) {
    if (lot.done) continue;
    if (t >= lot.ends) { resolveLot(lot); mark('auctions', 'garage'); continue; }
    if (aiStep(lot)) UI.lotChanged = true;
  }
  const before = S.lots.length;
  S.lots = S.lots.filter(l => !l.done || t - l.doneAt < 12000);
  if (S.lots.length !== before) mark('auctions');
  for (const j of S.jobs) if (j.state === 'active' && t >= j.endsAt) { completeJob(j); j.doneAt = t; mark('jobs', 'garage'); }
  const waiting = S.rideReady > t;
  if (waiting !== UI.rideWaiting) { UI.rideWaiting = waiting; mark('garage'); }
  flush();
  liveUpdate();

}

function flush() {

  const focused = document.activeElement && $('#main').contains(document.activeElement) && /INPUT|SELECT/.test(document.activeElement.tagName);

  S.lots = S.lots.filter(l => !l.done || t - l.doneAt < 12000);
  for (const j of S.jobs) if (j.state === 'active' && t >= j.endsAt) { completeJob(j); j.doneAt = t; }
  S.sellers = S.sellers.filter(s => s.state === 'open' ? t <= s.until : t <= (s.doneAt || s.until) + 15000);
  S.clients = S.clients.filter(c => c.state === 'open' ? t <= c.until : t <= (c.doneAt || c.until) + 15000);
  S.jobs = S.jobs.filter(j => j.state === 'active' || (j.state === 'open' ? t <= j.until : t <= (j.doneAt || j.until) + 15000));

const SFX = (() => {

  }

    bid() { if (!ctx()) return; tone(1180, now(), .12, .05, 'triangle'); },

function renderMain() {

/* ---------- Deals ---------- */
const payHint = pm => pm < .9 ? 'Under value' : pm < 1.1 ? 'Around value' : pm < 1.3 ? 'Above value' : 'Well above value';
const matches = (c, o) => {
  if (o.dud || plateLocked(o)) return false;

};

  return `${intro}${starter}
  <h2 class="h">On the street <small>Sellers come and go. Your guess is a range, not the real value.${S.sellers.filter(s => s.state === 'open').length < sellerCap() ? ` Next seller in ${cd(S.spawn.seller)}.` : ''}</small></h2>
  <div class="grid">${S.sellers.map(sellerCard).join('') || '<p class="empty">Nobody’s about. Someone new will turn up soon.</p>'}</div>

  <div class="grid">${S.clients.map(clientCard).join('') || `<p class="empty">No clients right now. The next one gets in touch in ${cd(S.spawn.client)}.</p>`}</div>`;
}
function sellerCard(s) {
  const d = describe(appraise(s.t).p);
  const st = s.state === 'open' ? `<button type="button" class="btn pri" data-act="haggle" data-id="${s.id}">Haggle</button>`
    : s.state === 'bought' ? `<span class="pill good">You bought it for ${gbp(s.paid)}</span>` : `<span class="pill">Walked off</span>`;
  const chk = s.check ? `<span class="pill ${s.check === 'clean' ? 'good' : 'bad'}">${s.check === 'clean' ? 'History: clean' : 'History: cloned'}</span>` : '';

    <header class="between"><div class="who">${avatar(s.n, s.hue)}<div><b>${esc(s.n)}</b><small>${esc(s.r)}</small></div></div>${s.state === 'open' ? `<span class="leave">Leaves in ${cd(s.until)}</span>` : ''}</header>

    <div class="row">${st}${chk}</div>

function clientCard(c) {

/* ---------- Auctions ---------- */
function auctionsHTML() {
  const lots = S.lots.slice().sort((a, b) => (b.mine - a.mine) || (a.done - b.done) || (a.ends - b.ends));
  return `<h2 class="h">Live auctions <small>Bid against the room. A bid in the last 10 seconds adds 10 seconds. You can sell your own plates here too, from the garage.</small></h2>
  <div class="grid">${lots.map(lotCard).join('') || `<p class="empty">The next lot opens in ${cd(S.spawn.lot)}.</p>`}</div>`;
}
function lotState(lot) {
  if (lot.done) return lot.result === 'won' || lot.result === 'sold' ? 'win' : '';
  if (lot.mine) return 'mine';
  if (lot.lead === 'you') return 'win';
  if (lot.bids.some(b => b.who === 'You')) return 'out';
  return '';
}
function leadText(lot) {
  if (lot.done) return ({ won: 'You won this lot.', sold: 'Sold.', unsold: 'Unsold. It’s back in your garage.', lost: `Sold to ${lot.leadName}.`, nobids: 'No bids. Withdrawn.', default: 'Cancelled. You couldn’t pay.' })[lot.result] || 'Closed.';
  if (lot.mine) return lot.hasBid ? (lot.cur >= lot.reserve ? `Reserve met. ${lot.leadName} leads.` : `Below your reserve of ${gbp(lot.reserve)}.`) : 'Waiting for the first bid.';
  if (!lot.hasBid) return 'No bids yet.';
  return lot.lead === 'you' ? 'You’re the highest bidder.' : `${lot.leadName} leads${lot.bids.some(b => b.who === 'You') ? '. You’ve been outbid.' : '.'}`;
}
function lotCard(lot) {
  const d = describe(appraise(lot.t).p), urgent = !lot.done && lot.ends - NOW() < 10000;
  const next = nextBid(lot);
  const btns = lot.done || lot.mine ? '' : `<div class="row"><button type="button" class="btn pri" data-act="bid" data-id="${lot.id}" ${lot.lead === 'you' || avail() < next ? 'disabled' : ''}>Bid ${gbp(next)}</button><button type="button" class="btn" data-act="maxbid" data-id="${lot.id}">${lot.myMax ? `Your max ${gbpS(lot.myMax)}` : 'Set a max bid'}</button></div>`;
  return `<article class="card-b lot ${lotState(lot)}${urgent ? ' urgent' : ''}" data-lot="${lot.id}">
    <header class="between">${lot.done ? '<span class="pill">Closed</span>' : `<span class="live"><i></i>${lot.mine ? 'Your lot' : 'Live'}</span>`}<span class="clock" data-cd="${lot.ends}">${lot.done ? '0:00' : fmtCd(lot.ends - NOW())}</span></header>
    ${plateHTML(lot.t)}
    <div class="meta">${d.fmt} · ${d.when} · ${lot.mine ? `Reserve ${lot.reserve ? gbp(lot.reserve) : 'none'}` : `Estimate ${gbpS(lot.est[0])}–${gbpS(lot.est[1])}`}</div>
    <dl class="kv"><div><dt>${lot.hasBid ? 'Current bid' : 'Opening bid'}</dt><dd class="cur">${gbp(lot.hasBid ? lot.cur : lot.start)}</dd></div><div><dt>In the room</dt><dd>${lot.bidders.length} bidders</dd></div></dl>
    <p class="lead">${esc(leadText(lot))}</p>
    <ul class="bids">${bidsHTML(lot)}</ul>
    ${btns}
  </article>`;
}
const bidsHTML = lot => lot.bids.map(b => `<li class="${b.who === 'You' ? 'you' : ''}"><span>${esc(b.who)}</span><span>${gbp(b.amt)}</span></li>`).join('');
function lotLive(lot) {
  const el = $(`[data-lot="${lot.id}"]`); if (!el) return;
  el.className = `card-b lot ${lotState(lot)}${!lot.done && lot.ends - NOW() < 10000 ? ' urgent' : ''}`;
  const clock = $('.clock', el); if (clock && !lot.done) clock.dataset.cd = lot.ends;
  $('.cur', el).textContent = gbp(lot.hasBid ? lot.cur : lot.start);

  $('.lead', el).textContent = leadText(lot);
  const bl = $('.bids', el), h = bidsHTML(lot); if (bl.innerHTML !== h) bl.innerHTML = h;
  const b = $('[data-act="bid"]', el);
  if (b) { const next = nextBid(lot); b.textContent = `Bid ${gbp(next)}`; b.disabled = lot.lead === 'you' || avail() < next; }
}

  const sortSel = `<select class="sel" id="g-sort" aria-label="Sort">${[['value', 'Highest value'], ['recent', 'Newest'], ['profit', 'Best profit']].map(([v, l]) => `<option value="${v}"${UI.gSort === v ? ' selected' : ''}>${l}</option>`).join('')}</select>`;
  const cards = list.map(o => {

      <div class="flags">${flags}</div></button>`;
  }).join('');
  return `<div class="g-stats"><div class="stat"><small>Plates</small><span class="v">${S.owned.length}</span></div><div class="stat"><small>Market value</small><span class="v">${gbp(total)}</span></div><div class="stat"><small>Paid</small><span class="v">${gbp(paid)}</span></div><div class="stat"><small>On paper</small><span class="v ${total - paid >= 0 ? 'good' : 'bad'}">${total - paid >= 0 ? '+' : ''}${gbp(total - paid)}</span></div></div>

}

function buyFrom(s, price) {

  S.owned.push({ id: nid(), t: s.t, paid: price, dud: s.dodgy, lock: false, src: s.n, lot: null });
  S.stats.bought++; addRep(3);
  log(`Bought ${s.t} from ${s.n}`, -price, s.dodgy ? 'Turned out to be cloned' : '');
  if (s.dodgy) SFX.bad(); else SFX.deal();
}
const SAY = {
  insult: ['Are you having a laugh?', 'Do one. That’s an insult.', 'I’m not giving it away.', 'You’re wasting my time.'],
  far: ['Nowhere near. Try again.', 'You’ll have to do better than that.', 'Come on, be serious.'],
  close: ['Now we’re talking. Meet me a bit higher?', 'Getting warmer.', 'Nearly. Bit more and it’s yours.'],
  yes: ['Go on then. Deal.', 'Done. Pleasure.', 'Shake on it.'],
  walk: ['Forget it. I’ll sell it elsewhere.', 'I’m off. Waste of my afternoon.', 'No deal. Bye.'],
};
function sellerRespond(s, x) {
  x = Math.round(x);
  if (!(x > 0)) { toast('Enter an offer in pounds.'); return; }
  if (x > avail()) { toast(`You only have ${gbp(avail())} to spend.`); return; }
  if (x >= s.counter) { buyFrom(s, s.counter); s.msg = pick(SAY.yes); return; }
  if (x >= s.reserve) {
    const p = .45 + .55 * (x - s.reserve) / Math.max(1, s.counter - s.reserve);
    if (Math.random() < p) { buyFrom(s, x); s.msg = pick(SAY.yes); return; }
    s.counter = Math.max(x + 1, roundNice(s.counter - (s.counter - x) * .5));
    s.pat--; s.msg = `${pick(SAY.close)} ${gbp(s.counter)}?`; s.mood = 'warn';
  } else if (x / s.reserve < .55) {
    s.pat -= 2; s.msg = pick(SAY.insult); s.mood = 'bad';
  } else {
    s.counter = Math.max(s.reserve, roundNice(s.counter - (s.counter - x) * rand(.15, .35)));
    s.pat--; s.msg = `${pick(SAY.far)} ${gbp(s.counter)}.`; s.mood = '';
  }
  if (s.pat <= 0) { s.state = 'gone'; s.doneAt = NOW(); s.msg = pick(SAY.walk); s.result = { kind: 'gone' }; SFX.bad(); }
}

function startSell(c, pid) {
  const o = plateById(+pid); if (!o) return;
  const top = Math.floor(Math.min(c.budget, mv(o.t) * c.pm * (S.upg.tongue ? 1.05 : 1)));
  const offer = Math.min(top, Math.max(5, roundNice(top * rand(.68, .85))));
  c.deal = { pid: o.id, offer, max: top, pat: c.pat, msg: `I’ll give you ${gbp(offer)} for it.`, mood: '' };
}
function sellPlate(o, price, via, note) {
  S.cash += price; S.stats.sold++; S.stats.profit += price - o.paid;
  S.cars.forEach(c => { if (c.plate === o.id) c.plate = null; });
  S.owned = S.owned.filter(x => x.id !== o.id);
  log(`Sold ${o.t} ${via}`, price, note || `Paid ${gbp(o.paid)}`);
  SFX.cash();
}
function clientRespond(c, x) {
  const dl = c.deal, o = plateById(dl.pid);
  x = Math.round(x);
  if (!(x > 0)) { toast('Enter a price in pounds.'); return; }
  if (!o) return;
  const done = price => {
    const a = appraise(o.t);
    dl.result = { kind: 'sold', price, paid: o.paid, t: o.t }; c.state = 'sold'; c.doneAt = NOW(); c.sold = { t: o.t, p: price };
    sellPlate(o, price, `to ${c.n}`); addRep(6 + 4 * a.tier);
    dl.msg = pick(['Lovely. Pleasure doing business.', 'Deal. They’ll love it.', 'Done. I’ll transfer it now.']);
  };
  if (x <= dl.offer) { done(x); return; }
  if (x <= dl.max) {
    const p = .4 + .6 * (dl.max - x) / Math.max(1, dl.max - dl.offer);
    if (Math.random() < p) { done(x); return; }
    dl.offer = Math.min(dl.max, roundNice(dl.offer + (x - dl.offer) * rand(.35, .6)));
    dl.pat--; dl.msg = `Bit steep. I could stretch to ${gbp(dl.offer)}.`; dl.mood = 'warn';
  } else if (x > dl.max * 1.5) {

const FX = (() => {
  let cv, g, parts = [], raf = 0;
  function attach(c) { cv = c; g = c.getContext('2d'); size(); }
  function size() { if (!cv) return; const d = Math.min(2, devicePixelRatio || 1); cv.width = innerWidth * d; cv.height = innerHeight * d; g.setTransform(d, 0, 0, d, 0, 0); }
  function burst(x, y, color, n) {
    if (!cv || reduceMotion.matches) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = rand(2, 9);
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3, life: 1, s: rand(3, 7), rot: rand(0, 6), vr: rand(-.3, .3), c: Array.isArray(color) ? pick(color) : color });
    }
    if (!raf) raf = requestAnimationFrame(step);
  }
  function step() {
    g.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life > 0);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.vy += .22; p.vx *= .985; p.rot += p.vr; p.life -= .012;
      g.save(); g.globalAlpha = Math.max(0, p.life); g.fillStyle = p.c; g.translate(p.x, p.y); g.rotate(p.rot); g.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); g.restore();
    }

  }
  addEventListener('resize', size);

})();

let rideRAF = 0;
function skyline(seed, H, body, win, winA, winP, minH, maxH) {
  const rng = mulberry32(seed); let x = 0, s = '';
  while (x < 1200) {
    const w = 40 + rng() * 90, h = H * (minH + rng() * (maxH - minH)), y = H - h;
    s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(w + 1).toFixed(1)}" height="${h.toFixed(1)}" fill="${body}"/>`;
    if (rng() < .16) s += `<rect x="${(x + w / 2).toFixed(1)}" y="${(y - 18).toFixed(1)}" width="2" height="18" fill="${body}"/>`;
    if (winA > 0) for (let wy = y + 10; wy < H - 12; wy += 14) for (let wx = x + 8; wx < x + w - 10; wx += 12) if (rng() < winP) s += `<rect x="${wx.toFixed(1)}" y="${wy.toFixed(1)}" width="5" height="7" fill="${win}" fill-opacity="${(winA * (.45 + rng() * .55)).toFixed(2)}"/>`;
    x += w + rng() * 6;
  }
  return "url('data:image/svg+xml;utf8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="${H}" viewBox="0 0 1200 ${H}">${s}</svg>`) + "')";
}

  const night = (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')) === 'dark';
  d.className = 'ride ' + (night ? 'night' : 'day');
  const far = night ? skyline(11, 300, '#161c30', '#ffd59a', .35, .1, .4, .95) : skyline(11, 300, '#a9b8cb', '#ffffff', 0, 0, .4, .95);
  const mid = night ? skyline(23, 260, '#0f1424', '#ffcf7a', .85, .32, .3, .9) : skyline(23, 260, '#7f90a6', '#dfe9f6', .5, .25, .3, .9);
  const near = night ? skyline(37, 200, '#080b14', '#ffc56a', .9, .3, .2, .7) : skyline(37, 200, '#5d6b80', '#e7eef8', .45, .25, .2, .7);
  d.innerHTML = `<div class="scene"><div class="sky"></div><div class="stars"></div><div class="orb"></div>

    <div class="road"><div class="dash"></div></div>
    <div class="ride-car"><div class="beam"></div>${carStageHTML(m, o)}</div>
    <button type="button" class="icon-btn ride-x" data-act="ride-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="ride-card" hidden></div></div>`;
  d.hidden = false; document.documentElement.style.overflow = 'hidden';
  SFX.engine();
  const layers = [['.sk.far', 14, 300], ['.sk.mid', 46, 260], ['.sk.near', 120, 200], ['.dash', 520, 0]].map(([s, v, h]) => {

    layers.forEach(L => { L.off = (L.off + L.v * f * dt / 1000) % L.tile; L.el.style.transform = `translate3d(${(-L.off).toFixed(1)}px,0,0)`; });

function revealRide(d, car) {

function closeRide() { cancelAnimationFrame(rideRAF); const d = $('#ride'); d.hidden = true; d.innerHTML = ''; document.documentElement.style.overflow = ''; UI.ride = null; checkSets(); render(); }

/* ================================================================
   Toast and plate fitting
   ================================================================ */
let toastT = 0;

new MutationObserver(queueFit).observe(document.body, { childList: true, subtree: true });
addEventListener('resize', queueFit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(queueFit);

/* ================================================================
   Actions

   ================================================================ */
