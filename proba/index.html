<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reg Hustle</title>
<meta name="description" content="Reg Hustle: a hard UK number-plate trading game. Haggle plates off people, sell them on, open packs and clear your debt to Del by day 30.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a lock-up yard at night. A HUD strip edged in double yellow lines,
   road-bay tabs, kerb-grey cards, and real UK plates as the hero object.
   Pack opening happens on a dark stage that looks the same in both themes. */
:root {
  --bg: #111417;
  --surface: #191e23;
  --raised: #222930;
  --line: #2e3740;
  --ink: #eef1f3;
  --ink-2: #a9b2bb;
  --ink-3: #727d88;
  --hi: #f7c52a;
  --good: #3fd08f;
  --bad: #ff5d55;
  --warn: #ffb020;
  --scrim: rgba(5, 7, 9, .74);
  --shadow: 0 14px 40px rgba(0, 0, 0, .45);
  --r0: #9aa5b1; --r1: #46c98e; --r2: #4f9cff; --r3: #b37dff; --r4: #ffae35; --r5: #ff5280;

  /* physical objects: plates, packs and the stage keep one look in every theme */
  --plate: #f7c52a;
  --plate-ink: #121314;
  --band: #1d47a6;
  --stage: #090b0e;
  --stage-2: #14181d;
  --stage-ink: #f1f3f5;
  --stage-ink-2: #9aa4ae;
  --s0: #9aa5b1; --s1: #46c98e; --s2: #4f9cff; --s3: #b37dff; --s4: #ffae35; --s5: #ff5280;

  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-plate: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e6e8e3; --surface: #f5f6f2; --raised: #ffffff; --line: #cbd0ca;
    --ink: #14181c; --ink-2: #47505a; --ink-3: #737d87;
    --hi: #8a6400; --good: #15804b; --bad: #c62f28; --warn: #9c6200;
    --scrim: rgba(20, 24, 28, .55); --shadow: 0 10px 30px rgba(20, 24, 28, .14);
    --r0: #626d79; --r1: #16834f; --r2: #1c66d4; --r3: #7537d6; --r4: #b56300; --r5: #cf1446;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e6e8e3; --surface: #f5f6f2; --raised: #ffffff; --line: #cbd0ca;
  --ink: #14181c; --ink-2: #47505a; --ink-3: #737d87;
  --hi: #8a6400; --good: #15804b; --bad: #c62f28; --warn: #9c6200;
  --scrim: rgba(20, 24, 28, .55); --shadow: 0 10px 30px rgba(20, 24, 28, .14);
  --r0: #626d79; --r1: #16834f; --r2: #1c66d4; --r3: #7537d6; --r4: #b56300; --r5: #cf1446;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; }
.num { font-family: var(--f-plate); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.muted { color: var(--ink-2); }
.good { color: var(--good); }
.bad { color: var(--bad); }

/* ---------- HUD ---------- */
.app { min-height: 100%; display: flex; flex-direction: column; }
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); padding: 10px 16px 0; }
.hud::after { content: ""; display: block; height: 7px; margin: 10px -16px 0;
  background: linear-gradient(var(--plate), var(--plate)) top / 100% 2px no-repeat, linear-gradient(var(--plate), var(--plate)) bottom / 100% 2px no-repeat; }
.hud-row { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 10px 22px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font: 900 26px/1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; }
.brand b { background: var(--plate); color: var(--plate-ink); padding: 3px 7px 1px; border-radius: 4px; box-shadow: inset 0 0 0 2px rgba(0,0,0,.6); }
.stat { display: grid; gap: 1px; min-width: 0; }
.stat small { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.stat .v { font: 600 22px/1 var(--f-plate); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .v.debt { color: var(--bad); }
.stat .v.clear { color: var(--good); }
.hud-sp { flex: 1; }
.hud-acts { display: flex; gap: 8px; align-items: center; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); }
.icon-btn svg { width: 20px; height: 20px; }

.trend { max-width: 1180px; margin: 8px auto 0; display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: baseline; font-size: 13px; color: var(--ink-2); }
.trend b { font-weight: 600; }
.trend .up { color: var(--good); }
.trend .dn { color: var(--bad); }

/* ---------- tabs ---------- */
.tabs { max-width: 1180px; width: 100%; margin: 0 auto; padding: 0 16px; display: flex; gap: 4px; }
.tabs button { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px; border: 0; background: none; color: var(--ink-2); font-weight: 600; border-bottom: 3px solid transparent; }
.tabs button svg { width: 18px; height: 18px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--plate); }
.tabs .badge { font: 600 12px/1 var(--f-plate); background: var(--raised); border: 1px solid var(--line); padding: 3px 6px; border-radius: 999px; }

main { flex: 1; width: 100%; max-width: 1180px; margin: 0 auto; padding-block: 18px 110px; padding-inline: 16px; }

/* ---------- common bits ---------- */
.btn { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--ink-3); }
.btn.pri { background: var(--plate); color: var(--plate-ink); border-color: transparent; }
.btn.pri:hover:not(:disabled) { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: 13.5px; border-radius: 8px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 5px 10px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line); color: var(--ink-2); }
.pill.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.tier { font: 700 10.5px/1 var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--tc); border: 1px solid color-mix(in srgb, var(--tc) 55%, transparent); padding: 4px 7px 3px; border-radius: 999px; white-space: nowrap; }
.h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 28px 0 12px; font: 800 30px/1 var(--f-display); text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.h:first-child { margin-top: 4px; }
.h small { font: 500 14px/1.3 var(--f-body); text-transform: none; color: var(--ink-2); letter-spacing: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; align-items: start; }
.empty { padding: 28px 18px; text-align: center; color: var(--ink-2); border: 1px dashed var(--line); border-radius: 14px; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0; }
.kv dt { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.kv dd { margin: 2px 0 0; font: 600 20px/1.1 var(--f-plate); font-variant-numeric: tabular-nums; }
.kv.three { grid-template-columns: repeat(3, 1fr); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- plate ---------- */
.plate { container-type: inline-size; width: 100%; }
.pl { position: relative; aspect-ratio: 520 / 111; border-radius: 1.9cqw; display: flex; align-items: center; overflow: hidden;
  background: linear-gradient(180deg, #ffe46e 0%, #f7c52a 46%, #e2aa0b 100%);
  box-shadow: inset 0 0 0 .55cqw rgba(0,0,0,.55), inset 0 .6cqw 0 rgba(255,255,255,.45), 0 .9cqw 2.4cqw rgba(0,0,0,.35); }
.pl.white { background: linear-gradient(180deg, #ffffff 0%, #f3f4ef 46%, #dcdfd8 100%); }
.pl .band { flex: 0 0 9.4%; align-self: stretch; margin: 1.3cqw 0 1.3cqw 1.3cqw; border-radius: 1.2cqw; background: var(--band); color: #fff;
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 1.7cqw; font: 700 4.8cqw/1 var(--f-plate); letter-spacing: .2cqw; }
.pl .tw { flex: 1; min-width: 0; display: flex; justify-content: center; overflow: hidden; padding: 0 1.5cqw 0 .5cqw; }
.pl .txt { display: inline-block; color: var(--plate-ink); font: 600 19.6cqw/1 var(--f-plate); letter-spacing: .5cqw; word-spacing: 3.2cqw; white-space: pre; transform: translateY(.5cqw) scaleX(var(--k, 1)); }
.pl::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.28) 44%, transparent 56%); pointer-events: none; }
.pl .stamp { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-8deg); font: 800 7cqw/1 var(--f-display); letter-spacing: .3cqw; color: #c3201b; border: .8cqw solid #c3201b; padding: 1cqw 2.4cqw .4cqw; border-radius: 1.4cqw; background: rgba(255,255,255,.55); }

/* ---------- Del ---------- */
.del { display: flex; gap: 14px; align-items: center; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; flex-wrap: wrap; }
.del .av { width: 46px; height: 46px; font-size: 20px; }
.del .txt { flex: 1 1 260px; min-width: 0; }
.del p { margin: 2px 0 0; color: var(--ink-2); }
.starter { margin-top: 12px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 14px 16px; border-radius: 14px; border: 1px solid color-mix(in srgb, var(--plate) 60%, transparent); background: color-mix(in srgb, var(--plate) 10%, var(--surface)); }
.starter p { flex: 1 1 240px; margin: 0; }
.starter b { font-weight: 600; }

/* ---------- people cards ---------- */
.deal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
.deal.done { opacity: .62; }
.who { display: flex; gap: 10px; align-items: center; min-width: 0; }
.who > div { min-width: 0; }
.who b { display: block; font-weight: 600; }
.who small { display: block; color: var(--ink-2); font-size: 13px; line-height: 1.3; }
.av { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font: 800 17px/1 var(--f-display);
  background: hsl(var(--h) 45% 32%); color: hsl(var(--h) 80% 90%); }
.meta { font-size: 12.5px; color: var(--ink-3); margin-top: -4px; }
.want { margin: 0; color: var(--ink-2); }
.want b { color: var(--ink); font-weight: 600; }

/* ---------- garage ---------- */
.g-stats { display: flex; gap: 8px 22px; flex-wrap: wrap; margin-bottom: 12px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.chip { min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.sel { min-height: 34px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font-size: 13.5px; }
.own { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 10px; box-shadow: inset 0 3px 0 var(--tc); }
.own:hover { border-color: var(--ink-3); }
.own .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.own .val { font: 600 21px/1 var(--f-plate); font-variant-numeric: tabular-nums; }
.own .sub { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--ink-3); flex-wrap: wrap; }
.flags { display: flex; gap: 6px; flex-wrap: wrap; }
.flags:empty { display: none; }

/* ---------- packs ---------- */
.packs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; align-items: start; }
.pack-tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; justify-items: center; text-align: center; }
.pack-tile h3 { margin: 0; font: 800 24px/1 var(--f-display); text-transform: uppercase; }
.pack-tile p { margin: 0; color: var(--ink-2); font-size: 13.5px; max-width: 34ch; }
.pack-tile .price { font: 600 26px/1 var(--f-plate); font-variant-numeric: tabular-nums; }
.odds { width: 100%; text-align: left; font-size: 12.5px; }
.odds summary { cursor: pointer; color: var(--ink-2); font-weight: 600; list-style: none; text-align: center; }
.odds summary::-webkit-details-marker { display: none; }
.odds table { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
.odds td { padding: 3px 0; border-bottom: 1px solid var(--line); }
.odds td:last-child { text-align: right; font-family: var(--f-plate); font-size: 14px; }

.pack { --w: 170px; width: var(--w); aspect-ratio: 5 / 8; border-radius: 14px; position: relative; overflow: hidden; display: flex; flex-direction: column;
  background: var(--pk-bg); color: var(--pk-ink); box-shadow: 0 16px 34px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.12); border: 0; padding: 0; font: inherit; }
.pack .crimp { flex: 0 0 9%; background: repeating-linear-gradient(90deg, rgba(255,255,255,.2) 0 2px, rgba(0,0,0,.12) 2px 5px), var(--pk-crimp); }
.pack .body { flex: 1; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 12% 10% 10%; gap: 8px; }
.pack .kick { font: 700 11px/1 var(--f-body); letter-spacing: .16em; text-transform: uppercase; opacity: .85; }
.pack .nm { font: 900 calc(var(--w) * .2)/.86 var(--f-display); text-transform: uppercase; text-align: center; letter-spacing: .01em; }
.pack .mini { width: 92%; }
.pack .stripe { width: 100%; height: 8px; background: var(--pk-stripe); border-radius: 2px; }
.pack::after { content: ""; position: absolute; inset: -40%; background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.22) 48%, transparent 56%); transform: translateX(-30%); transition: transform .8s ease; pointer-events: none; }
.pack-tile:hover .pack::after, .pack:hover::after { transform: translateX(30%); }
.pack .free { position: absolute; top: 14%; right: -30%; transform: rotate(35deg); width: 100%; text-align: center; background: var(--plate); color: var(--plate-ink); font: 800 13px/1 var(--f-display); letter-spacing: .1em; padding: 5px 0 3px; }
.art-street { --pk-bg: linear-gradient(180deg, #1c1f23, #0f1114); --pk-ink: #f7c52a; --pk-crimp: #f7c52a; --pk-stripe: repeating-linear-gradient(-45deg, #f7c52a 0 9px, #111 9px 18px); }
.art-classic { --pk-bg: linear-gradient(170deg, #145140, #0a2a20 70%); --pk-ink: #efe4c3; --pk-crimp: #c9a24a; --pk-stripe: linear-gradient(90deg, #c9a24a, #efe4c3, #c9a24a); }
.art-custom { --pk-bg: linear-gradient(160deg, #eef1f5 0%, #9aa3b0 40%, #e2e6ec 62%, #7f8896 100%); --pk-ink: #10141a; --pk-crimp: #4f9cff; --pk-stripe: linear-gradient(90deg, #4f9cff, #b37dff); }
.art-dateless { --pk-bg: radial-gradient(120% 80% at 50% 0%, #1c3270, #070f26 70%); --pk-ink: #e9c66a; --pk-crimp: #e9c66a; --pk-stripe: linear-gradient(90deg, #8a6a20, #f2d68a, #8a6a20); }
.art-crate { --pk-bg: conic-gradient(from 210deg at 50% 60%, #1a0b16, #3a0d24, #12091a, #2a0b30, #1a0b16); --pk-ink: #fff; --pk-crimp: #ff5280; --pk-stripe: linear-gradient(90deg, #ff5280, #ffae35, #b37dff, #4f9cff, #ff5280); }

/* ---------- studio ---------- */
.studio { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.panel h3 { margin: 0; font: 800 22px/1 var(--f-display); text-transform: uppercase; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { min-height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--raised); font-weight: 600; font-size: 13.5px; }
.seg button[aria-pressed="true"] { background: var(--plate); color: var(--plate-ink); border-color: transparent; }
.field { display: grid; gap: 6px; }
.field label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.field input { min-height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); padding: 0 14px; font: 600 26px/1 var(--f-plate); letter-spacing: .08em; text-transform: uppercase; width: 100%; }
.field input[aria-invalid="true"] { border-color: var(--bad); }
.hint { margin: 0; font-size: 13px; color: var(--ink-2); }
.hint.err { color: var(--bad); }
.tags { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.tags li { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.tags li span:last-child { font-family: var(--f-plate); font-size: 15px; font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
.ideas { display: flex; gap: 6px; flex-wrap: wrap; }
.ideas button { border: 1px solid var(--line); background: var(--raised); border-radius: 8px; padding: 5px 9px; font: 600 15px/1 var(--f-plate); letter-spacing: .05em; }

/* ---------- kit ---------- */
.kit { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; align-items: start; }
.upg { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.upg h3 { margin: 0; font: 800 21px/1 var(--f-display); text-transform: uppercase; }
.upg p { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.lv { display: flex; gap: 4px; }
.lv i { width: 22px; height: 6px; border-radius: 2px; background: var(--line); }
.lv i.on { background: var(--plate); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; margin-top: 8px; }
.ledger { list-style: none; margin: 0; padding: 0; max-height: 420px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.ledger li { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.ledger li:last-child { border-bottom: 0; }
.ledger .d { color: var(--ink-3); font-family: var(--f-plate); }
.ledger .a { font-family: var(--f-plate); font-size: 15px; font-variant-numeric: tabular-nums; }
.howto { margin: 0; padding-left: 20px; display: grid; gap: 8px; color: var(--ink-2); max-width: 65ch; }
.howto b { color: var(--ink); font-weight: 600; }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: grid; place-items: center; padding: 16px; }
.sheet { position: relative; width: min(560px, 100%); max-height: calc(100% - 16px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: var(--shadow); display: grid; gap: 16px; animation: rise .25s ease; }
@keyframes rise { from { transform: translateY(14px); opacity: .4; } }
.sheet h2 { margin: 0; font: 800 28px/1 var(--f-display); text-transform: uppercase; padding-right: 40px; text-wrap: balance; }
.sheet .x { position: absolute; top: 12px; right: 12px; }
.say { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); font-size: 15px; }
.say.good { border-color: color-mix(in srgb, var(--good) 55%, transparent); }
.say.bad { border-color: color-mix(in srgb, var(--bad) 55%, transparent); }
.say.warn { border-color: color-mix(in srgb, var(--warn) 55%, transparent); }
.pips { display: inline-flex; gap: 4px; vertical-align: middle; }
.pips i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.pips i.on { background: var(--warn); }
.offer { display: grid; gap: 8px; }
.offer label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.money { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); padding-left: 14px; }
.money span { font: 600 26px/1 var(--f-plate); color: var(--ink-3); }
.money input { flex: 1; min-width: 0; border: 0; background: none; min-height: 50px; padding: 0 10px; font: 600 28px/1 var(--f-plate); font-variant-numeric: tabular-nums; }
.money input:focus { outline: none; }
.money:focus-within { outline: 2px solid var(--hi); outline-offset: 2px; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.fine { margin: 0; font-size: 12.5px; color: var(--ink-3); }
.picks { display: grid; gap: 8px; }
.pick { display: grid; grid-template-columns: minmax(0, 150px) 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--raised); }
.pick:hover { border-color: var(--ink-3); }
.pick b { font: 600 18px/1 var(--f-plate); }
.lines { list-style: none; margin: 0; padding: 0; display: grid; }
.lines li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.lines li span:last-child { font-family: var(--f-plate); font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.big-v { font: 600 44px/1 var(--f-plate); font-variant-numeric: tabular-nums; }
.toggle-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

/* ---------- pack stage ---------- */
.ov { position: fixed; inset: 0; z-index: 60; background: radial-gradient(120% 90% at 50% 30%, var(--stage-2), var(--stage) 70%); color: var(--stage-ink); display: grid; grid-template-rows: auto 1fr auto; overflow: auto; }
.ov canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.ov-top { padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 0; text-align: center; display: grid; gap: 4px; }
.ov-top b { font: 900 34px/1 var(--f-display); text-transform: uppercase; }
.ov-top span { color: var(--stage-ink-2); font-size: 14px; }
.ov-mid { display: grid; place-items: center; padding: 20px 16px; min-height: 0; }
.ov .pack { --w: min(240px, 58vw); cursor: pointer; animation: hover 2.4s ease-in-out infinite; }
@keyframes hover { 50% { transform: translateY(-8px) rotate(-1deg); } }
.ov .pack.tear { animation: shake .5s ease; }
.ov .pack.tear .crimp:first-child { animation: rip .55s ease-in forwards; }
.ov .pack.gone { animation: drop .45s ease-in forwards; }
@keyframes shake { 20% { transform: rotate(-4deg); } 40% { transform: rotate(4deg); } 60% { transform: rotate(-3deg); } 80% { transform: rotate(2deg); } }
@keyframes rip { to { transform: translate(40%, -260%) rotate(24deg); opacity: 0; } }
@keyframes drop { to { transform: translateY(70%) scale(.85); opacity: 0; } }
.cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; max-width: 900px; }
.card { width: clamp(138px, 27vw, 188px); aspect-ratio: 5 / 7; perspective: 1000px; background: none; border: 0; padding: 0; animation: dealIn .5s cubic-bezier(.2,.9,.3,1.2) backwards; }
@keyframes dealIn { from { transform: translateY(60px) scale(.85) rotate(-6deg); opacity: 0; } }
.card .ci { display: block; position: relative; width: 100%; height: 100%; transition: transform .75s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; }
.card.flipped .ci { transform: rotateY(180deg); }
.card .face { position: absolute; inset: 0; border-radius: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
.card .back { background: repeating-linear-gradient(-45deg, #f7c52a 0 12px, #16181b 12px 24px); box-shadow: inset 0 0 0 6px #16181b, 0 10px 24px rgba(0,0,0,.5); display: grid; place-items: center; }
.card .back span { background: #16181b; color: #f7c52a; font: 900 28px/1 var(--f-display); padding: 10px 12px 6px; border-radius: 8px; letter-spacing: .04em; }
.card.tease .back { box-shadow: inset 0 0 0 6px #16181b, 0 0 0 2px var(--tc), 0 0 38px var(--tc); animation: tease 1.1s ease-in-out infinite; }
@keyframes tease { 50% { box-shadow: inset 0 0 0 6px #16181b, 0 0 0 3px var(--tc), 0 0 64px var(--tc); } }
.card .front { transform: rotateY(180deg); background: linear-gradient(180deg, #1b2026, #111418); border: 2px solid var(--tc); box-shadow: 0 0 34px color-mix(in srgb, var(--tc) 55%, transparent); display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; padding: 12px; text-align: left; color: var(--stage-ink); }
.card .front .tier { align-self: flex-start; }
.card .front .cv { font: 600 26px/1 var(--f-plate); font-variant-numeric: tabular-nums; }
.card .front small { color: var(--stage-ink-2); font-size: 11.5px; line-height: 1.35; }
.card.myth .front { background: linear-gradient(180deg, #2a0f1f, #120a12); animation: holo 3s linear infinite; }
@keyframes holo { 0% { border-color: #ff5280; } 33% { border-color: #ffae35; } 66% { border-color: #4f9cff; } 100% { border-color: #ff5280; } }
.ov-bot { padding: 0 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; justify-items: center; text-align: center; }
.ov-bot .sum { font-size: 15px; color: var(--stage-ink-2); }
.ov-bot .sum b { color: var(--stage-ink); font: 600 22px/1 var(--f-plate); }
.ov .btn { background: #232a31; border-color: #3a434d; color: var(--stage-ink); }
.ov .btn.pri { background: var(--plate); color: var(--plate-ink); border-color: transparent; }
.flash { position: fixed; inset: 0; z-index: 3; pointer-events: none; background: var(--tc); opacity: 0; }
.flash.go { animation: flash .7s ease-out; }
@keyframes flash { 0% { opacity: .55; } 100% { opacity: 0; } }

/* ---------- toast ---------- */
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); z-index: 80; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); text-align: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------- responsive ---------- */
@media (max-width: 860px) {
  .studio, .cols { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .hud { padding-top: 8px; }
  .hud-row { gap: 8px 16px; }
  .brand { font-size: 22px; flex-basis: 100%; }

  .stat .v { font-size: 19px; }
  .hud-sp { display: none; }

  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; max-width: none; padding: 0 4px env(safe-area-inset-bottom, 0px); background: var(--surface); border-top: 1px solid var(--line); justify-content: space-around; gap: 0; }
  .tabs button { flex: 1 1 0; flex-direction: column; gap: 3px; padding: 9px 2px 8px; font-size: 11.5px; border-bottom: 0; border-top: 3px solid transparent; min-width: 0; }
  .tabs button[aria-selected="true"] { border-top-color: var(--plate); }
  .tabs .badge { display: none; }
  .h { font-size: 26px; }
  .kv.three { grid-template-columns: 1fr 1fr; }
  .pick { grid-template-columns: minmax(0, 120px) 1fr; }
  .pick > :last-child { grid-column: 1 / -1; }
  .sheet { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

<body>
<div class="app">

<script>
(() => {
'use strict';

/* ================================================================
   Utilities
   ================================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const wpick = (items, ws) => { let k = Math.random() * ws.reduce((a, b) => a + b, 0); for (let i = 0; i < items.length; i++) { k -= ws[i]; if (k <= 0) return items[i]; } return items[items.length - 1]; };
const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const mulberry32 = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const gbp = v => (v < 0 ? '−' : '') + '£' + Math.round(Math.abs(v)).toLocaleString('en-GB');
const gbpS = v => {
  const a = Math.abs(v), s = v < 0 ? '−' : '';
  if (a >= 1e6) return s + '£' + (a / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'm';
  if (a >= 1e4) return s + '£' + Math.round(a / 1e3) + 'k';
  if (a >= 1e3) return s + '£' + (a / 1e3).toFixed(1).replace(/\.0$/, '') + 'k';
  return s + '£' + Math.round(a);
};
const pct = f => (f >= 0 ? '+' : '−') + Math.round(Math.abs(f) * 100) + '%';
const roundNice = v => { const st = v < 100 ? 5 : v < 1000 ? 10 : v < 10000 ? 50 : v < 100000 ? 500 : 5000; return Math.max(st, Math.round(v / st) * st); };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

/* ================================================================
   UK registration rules
   ================================================================ */
const PRE_YEAR = { A: 1983, B: 1984, C: 1985, D: 1986, E: 1987, F: 1988, G: 1989, H: 1990, J: 1991, K: 1992, L: 1993, M: 1994, N: 1995, P: 1996, R: 1997, S: 1998, T: 1999, V: 1999, W: 2000, X: 2000, Y: 2001 };
const SUF_YEAR = { A: 1963, B: 1964, C: 1965, D: 1966, E: 1967, F: 1967, G: 1968, H: 1969, J: 1970, K: 1971, L: 1972, M: 1973, N: 1974, P: 1975, R: 1976, S: 1977, T: 1978, V: 1979, W: 1980, X: 1981, Y: 1982 };
const YL = Object.keys(PRE_YEAR).join('');
const AREA1 = 'ABCDEFGHKLMNOPRSVWY';
const AREA2 = 'ABCDEFGHJKLMNOPRSTUVWXY';
const AREA_NAME = { A: 'Anglia', B: 'Birmingham', C: 'Wales', D: 'Deeside', E: 'Essex', F: 'Forest & Fens', G: 'Kent', H: 'Hampshire', K: 'Milton Keynes', L: 'London', M: 'Manchester', N: 'the North-east', O: 'Oxford', P: 'Preston', R: 'Reading', S: 'Scotland', V: 'Severn Valley', W: 'the West Country', Y: 'Yorkshire' };
const RL = 'ABCDEFGHJKLMNOPRSTUVWXYZ';
const AGES = [];
for (let i = 2; i <= 26; i++) AGES.push(String(i).padStart(2, '0'));
for (let i = 51; i <= 75; i++) AGES.push(String(i));

const LEET = { 0: 'O', 1: 'IL', 2: 'ZR', 3: 'E', 4: 'A', 5: 'S', 6: 'G', 7: 'T', 8: 'B', 9: 'G' };
function decode(s) {
  let out = [''];
  for (const ch of s) { const o = LEET[ch] || ch; out = out.flatMap(x => [...o].map(c => x + c)); }
  return out;
}

const NAMES3 = new Set('SAM TOM BEN JOE DAN AMY KAT ZOE LEO MAX TED ROB JON KEN RAY LEE IAN ALI EVE MIA ELI GUS JIM TIM KIM SUE VAL BOB LIZ MEG NED ROY DES DEL LEN GAZ BAZ DAZ KAY JAY JAN BEA ABI'.split(' '));
const WORDS3 = new Set('ACE VIP CEO GTI DAD MUM WIN HOT RAD MAD BAD CAR VAN KEY MOB KID RED TOP YES WOW BRO BOY MAN GEM CAT DOG FOX OWL SUN SKY ICE ART JET RUN'.split(' '));
const NAMES4 = new Set('ROSS BILL WILL GILL NELL SARA LARA NORA CORA ROSE ROSA'.split(' '));
const WORDS4 = new Set(('BOSS MISS LASS MOSS PASS KISS BASS MASS LOSS BEST FAST LAST POST MOST VAST LOST MUST RUST WEST NEST CAST ' +
  'HELL BELL WELL SELL BULL FULL BALL CALL FALL HALL MALL WALL DOLL POLL ROLL HILL KILL MILL FILL LEGS BOOT FOOT LOOT ROOT ' +
  'POLO SOLO HALO MILE SALE PAGE SAGE RAGE CAGE SAGA YOGA LATE MATE DATE GATE RATE NOTE VOTE SITE BYTE DATA DOOR POOR MOOR ' +
  'SHOE SNOB BLOG SMOG FROG GIRL CURL BUZZ FIZZ OURS MORE CARE HERE DARE PURE SURE CORE FIRE HIRE EURO HERO BOLT COLT BELT ' +
  'SALT WISE BASE CASE AUTO CATS PETS NUTS').split(' '));
const NAMESL = new Set('SARAH JAMES DAVID KAREN BILLY RICKY MILES JASON MASON LEWIS TERRY GARRY HARRY LARRY DANNY KELLY SALLY JENNY PETER KEVIN SIMON JAMIE NICKY MICKY VICKY JACKY BECKY DEBBY GEMMA HELEN KATIE MARIE CARLA NAOMI DEREK TANYA LEANNE MEGAN'.split(' '));
const WORDSL = new Set('BIGBOY LARGE MATES SAINT BEAST FASTER LEGEND BLESS GIANT'.split(' '));
const NAMES3L = [...NAMES3], WORDS3L = [...WORDS3];

function parse(raw) {
  const t = String(raw || '').toUpperCase().replace(/\s+/g, ' ').trim();
  let m;
  if ((m = t.match(/^([A-Z])([A-Z])(\d\d) ([A-Z]{3})$/))) {
    if (!AREA1.includes(m[1]) || !AREA2.includes(m[2]) || !AGES.includes(m[3]) || /Q/.test(m[4])) return null;
    return { f: 'cur', a: m[1] + m[2], age: m[3], r: m[4], t };
  }
  if ((m = t.match(/^([A-Z])(\d{1,3}) ([A-Z]{3})$/))) {
    if (!PRE_YEAR[m[1]] || m[2][0] === '0' || /Q/.test(m[3])) return null;
    return { f: 'pre', y: m[1], n: m[2], r: m[3], t };
  }
  if ((m = t.match(/^([A-Z]{3}) (\d{1,3})([A-Z])$/))) {
    if (!SUF_YEAR[m[3]] || m[2][0] === '0' || /Q/.test(m[1])) return null;
    return { f: 'suf', r: m[1], n: m[2], y: m[3], t };
  }
  if ((m = t.match(/^([A-Z]{1,3}) (\d{1,4})$/))) {
    if (m[2][0] === '0' || /Q/.test(m[1])) return null;
    return { f: 'dl', l: m[1], n: m[2], nf: false, t };
  }
  if ((m = t.match(/^(\d{1,4}) ([A-Z]{1,3})$/))) {
    if (m[1][0] === '0' || /Q/.test(m[2])) return null;
    return { f: 'dl', l: m[2], n: m[1], nf: true, t };
  }
  return null;
}

const FORMAT_NAME = { cur: 'Current', pre: 'Prefix', suf: 'Suffix', dl: 'Dateless' };
function describe(p) {
  if (p.f === 'cur') {
    const a = +p.age, when = a < 50 ? `Mar ${2000 + a}` : `Sep ${2000 + a - 50}`;
    return { fmt: 'Current', when, where: AREA_NAME[p.a[0]] };
  }
  if (p.f === 'pre') return { fmt: 'Prefix', when: String(PRE_YEAR[p.y]) };
  if (p.f === 'suf') return { fmt: 'Suffix', when: String(SUF_YEAR[p.y]) };
  return { fmt: 'Dateless', when: 'pre-1963' };
}

const TIERS = [
  { id: 'common', name: 'Common', min: 0 },
  { id: 'uncommon', name: 'Uncommon', min: 200 },
  { id: 'rare', name: 'Rare', min: 800 },
  { id: 'epic', name: 'Epic', min: 3500 },
  { id: 'legendary', name: 'Legendary', min: 15000 },
  { id: 'mythic', name: 'Mythic', min: 75000 },
];
const tierOf = v => { let i = 0; TIERS.forEach((t, k) => { if (v >= t.min) i = k; }); return i; };
const isTriple = s => s.length === 3 && s[0] === s[1] && s[1] === s[2];
const isRun = s => s.charCodeAt(1) === s.charCodeAt(0) + 1 && s.charCodeAt(2) === s.charCodeAt(1) + 1;
const isRep = n => n.length >= 2 && /^(\d)\1+$/.test(n);
const DL_BASE = { 2: 120000, 3: 14000, 4: 4500, 5: 1500, 6: 700, 7: 400 };

/* The appraisal is the hidden truth behind every plate. */
const AP = new Map();
function appraise(raw) {
  const p = parse(raw);
  if (!p) return null;
  if (AP.has(p.t)) return AP.get(p.t);
  const tags = [];
  const add = (l, m, c) => tags.push({ l, m, c });
  let base, baseL;
  if (p.f === 'cur') {
    base = 80; baseL = 'Current-style plate';
    const r = p.r, fw = decode(p.a + p.age).find(w => WORDS4.has(w) || NAMES4.has(w));
    const rN = NAMES3.has(r), rW = WORDS3.has(r);
    if (fw) {
      add(`Spells ${fw}`, 14, NAMES4.has(fw) ? 'names' : 'words');
      if (rN || rW) add(`Reads “${fw} ${r}”`, 3, 'words');
    } else {
      if (p.age === '51' || p.age === '02') add('First-issue age identifier', 1.3, 'pattern');
      if (p.age[0] === p.age[1]) add(`Matching age ${p.age}`, 1.4, 'pattern');
    }
    if (p.a[0] === p.a[1]) add(`Double area code ${p.a}`, 1.4, 'pattern');
    if (isTriple(r)) add(`Triple letters ${r}`, 3.5, 'pattern');
    else if (isRun(r)) add(`Letter run ${r}`, 2, 'pattern');
    else if (!fw && (rN || rW)) add(`${rN ? 'Name' : 'Word'}: ${r}`, 2.2, rN ? 'names' : 'words');
    else if (r[0] === r[1] || r[1] === r[2]) add('Letter pair', 1.2, 'pattern');
    if (r.startsWith(p.a)) add(`Echoes ${p.a}`, 1.3, 'pattern');
  } else if (p.f === 'pre') {
    base = 140; baseL = 'Prefix plate';
    const w = decode(p.y + p.n + p.r).find(x => NAMESL.has(x) || WORDSL.has(x));

    if (p.n === '1') add('Number 1', 4, 'low');
    else if (p.n.length === 1) add(`Single digit ${p.n}`, 2, 'low');
    else if (isRep(p.n)) add(`Repeating ${p.n}`, 1.6, 'pattern');
    if (!w) {
      if (isTriple(p.r)) add(`Triple letters ${p.r}`, 3, 'pattern');
      else if (NAMES3.has(p.r)) add(`Name: ${p.r}`, 2, 'names');
      else if (WORDS3.has(p.r)) add(`Word: ${p.r}`, 2, 'words');

    base = 180; baseL = 'Suffix plate';

    else if (isRep(p.n)) add(`Repeating ${p.n}`, 1.4, 'pattern');
    if (isTriple(p.r)) add(`Triple letters ${p.r}`, 3, 'pattern');
    else if (NAMES3.has(p.r)) add(`Name: ${p.r}`, 3, 'names');
    else if (WORDS3.has(p.r)) add(`Word: ${p.r}`, 2.5, 'words');

    const len = p.l.length + p.n.length;
    base = DL_BASE[len]; baseL = `Dateless, ${len} characters`;
    if (p.n === '1') add('Number 1', 2.5, 'low');
    else if (p.n === '7') add('Lucky 7', 1.8, 'low');
    else if (p.n.length === 1) add(`Single digit ${p.n}`, 1.4, 'low');
    if (isRep(p.n)) add(`Repeating ${p.n}`, 1.5, 'pattern');
    else if (/^[1-9]0+$/.test(p.n)) add(`Round number ${p.n}`, 1.3, 'pattern');
    if (NAMES3.has(p.l)) add(`Name: ${p.l}`, 4, 'names');
    else if (WORDS3.has(p.l)) add(`Word: ${p.l}`, 3, 'words');
    else if (p.l.length === 2 && p.l[0] === p.l[1]) add(`Double letters ${p.l}`, 1.4, 'pattern');
    else if (isTriple(p.l)) add(`Triple letters ${p.l}`, 2, 'pattern');
    if (p.nf) add('Number comes first', .85, null);

  const v = Math.min(2e6, Math.max(20, Math.round(base * tags.reduce((x, g) => x * g.m, 1) * noise)));
  const fc = { cur: 'current', pre: 'classic', suf: 'classic', dl: 'dateless' }[p.f];
  const cats = new Set([fc, ...tags.filter(g => g.c).map(g => g.c)]);
  const a = { t: p.t, p, base, baseL, noise, tags, v, tier: tierOf(v), cats, custom: p.f === 'dl' || cats.has('names') || cats.has('words') };
  AP.set(p.t, a);
  return a;
}

const REV = { O: '0', I: '1', L: '1', Z: '2', E: '3', A: '4', S: '5', G: '6', T: '7', B: '8' };

for (const a1 of AREA1) for (const a2 of AREA2) for (const ag of AGES) {
  const w = decode(a1 + a2 + ag).find(x => WORDS4.has(x) || NAMES4.has(x));
  if (w) CUR_WORDS.push(a1 + a2 + ag);
}
const PRE_WORDS = [];
[...NAMESL, ...WORDSL].forEach(w => {
  const mid = w.slice(1, -3);
  if (!mid.length || mid.length > 3 || ![...mid].every(c => REV[c])) return;
  const code = w[0] + [...mid].map(c => REV[c]).join('') + ' ' + w.slice(-3);

const r3 = () => pick(RL) + pick(RL) + pick(RL);
const lets = k => Array.from({ length: k }, () => pick(RL)).join('');
const num = k => String(ri(10 ** (k - 1), 10 ** k - 1));
const dl = (lc, nc) => Math.random() < .15 ? `${num(nc)} ${lets(lc)}` : `${lets(lc)} ${num(nc)}`;
const GEN = {
  curRand: () => pick(AREA1) + pick(AREA2) + pick(AGES) + ' ' + r3(),
  curPat: () => {
    let a = pick(AREA1) + pick(AREA2), age = pick(AGES), r = r3();
    const k = Math.random();
    if (k < .25) { const c = pick(RL); r = c + c + c; }
    else if (k < .42) { const s = ri(65, 87); r = String.fromCharCode(s, s + 1, s + 2); }
    else if (k < .62) r = pick(Math.random() < .5 ? NAMES3L : WORDS3L);
    else if (k < .8) age = pick(AGES.filter(x => x[0] === x[1]));
    else if (k < .9) { const c = pick([...AREA1].filter(x => AREA2.includes(x))); a = c + c; }

  },
  curWord: () => pick(CUR_WORDS) + ' ' + (Math.random() < .35 ? pick(Math.random() < .5 ? NAMES3L : WORDS3L) : r3()),
  preRand: () => pick(YL) + ri(1, 999) + ' ' + r3(),
  preLow: () => pick(YL) + (Math.random() < .4 ? 1 : ri(2, 9)) + ' ' + r3(),
  preName: () => pick(PRE_WORDS),
  sufRand: () => r3() + ' ' + ri(1, 999) + pick(YL),
  sufLow: () => r3() + ' ' + (Math.random() < .4 ? 1 : ri(2, 9)) + pick(YL),
  sufName: () => pick(Math.random() < .6 ? NAMES3L : WORDS3L) + ' ' + ri(1, 999) + pick(YL),
  dl7: () => dl(3, 4),
  dl6: () => Math.random() < .5 ? dl(3, 3) : dl(2, 4),
  dl5: () => { const c = pick([[3, 2], [2, 3], [1, 4]]); return dl(c[0], c[1]); },
  dl4: () => { const c = pick([[3, 1], [2, 2], [1, 3]]); return dl(c[0], c[1]); },
  dl3: () => { const c = pick([[2, 1], [1, 2]]); return dl(c[0], c[1]); },
  dl2: () => dl(1, 1),
  dlName: () => pick(Math.random() < .75 ? NAMES3L : WORDS3L) + ' ' + (Math.random() < .35 ? 1 : ri(2, 99)),

const POOLS = {
  normal: { curRand: 5, curPat: 3, preRand: 3, preLow: 1.5, sufRand: 2, sufLow: 1 },
  custom: { curWord: 3, preName: 3, sufName: 2, dlName: 2, curPat: 1, dl4: .6, dl3: .3, dl2: .15 },
  classic: { preRand: 3, preLow: 2, sufRand: 3, sufLow: 2, preName: .5, sufName: 1, dl7: 1, dl6: 1, dl5: .6 },
  dateless: { dl7: 1, dl6: 2, dl5: 2, dl4: 2, dl3: 1.5, dl2: .6, dlName: 1.5 },
  street: { curRand: 6, curPat: 3, curWord: 1, preRand: 4, preLow: 1.5, preName: .8, sufRand: 3, sufLow: 1, sufName: 1, dl7: 1, dl6: 1, dl5: .7, dl4: .4, dl3: .2, dlName: .4, dl2: .05 },
};
/* Roll a plate of an exact tier from a pool; the appraisal decides the tier. */
function rollPlate(pool, tier, ex) {
  const kinds = Object.keys(POOLS[pool]), ws = kinds.map(k => POOLS[pool][k]);
  let best = null, bd = 99;
  for (let i = 0; i < 900; i++) {
    const t = GEN[wpick(kinds, ws)]();
    const a = appraise(t);
    if (!a || (ex && ex.has(a.t))) continue;
    if (a.tier === tier) return a.t;
    const d = Math.abs(a.tier - tier);
    if (d < bd) { bd = d; best = a.t; }
  }
  return best;
}

/* ================================================================

function plateHTML(t, o = {}) {
  return `<div class="plate"${o.style ? ` style="${o.style}"` : ''}><div class="pl${P.plate === 'white' ? ' white' : ''}" role="img" aria-label="Registration ${esc(t)}"><span class="band">UK</span><span class="tw"><span class="txt">${esc(t)}</span></span>${o.dud ? '<span class="stamp">CLONED</span>' : ''}</div></div>`;
}
const tierChip = i => `<span class="tier" style="--tc:var(--r${i})">${TIERS[i].name}</span>`;
const avatar = (n, h) => `<span class="av" style="--h:${h}" aria-hidden="true">${esc(n[0])}</span>`;
const pips = (n, max) => `<span class="pips" aria-label="${n} of ${max} patience left">${Array.from({ length: max }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>`;
const daysLeft = () => DEADLINE - S.day;

function delLine() {
  if (S.cleared) return `We’re square. You paid me back on day ${S.cleared}. Pleasure doing business.`;
  const d = daysLeft(), owe = gbp(S.debt);
  if (d === 0) return `Last day. ${owe} by tonight, or my lads come round for the lot.`;
  if (d <= 3) return `${owe}. ${d} days. I’m losing my patience.`;
  if (d <= 10) return `${owe} and counting. ${d} days left. Tick tock.`;
  if (S.day === 1) return `You owe me ${owe}, plus 2.5% a day. Have it back by the end of day ${DEADLINE}. Here’s a free pack to get you going.`;
  return `${owe} with interest. You’ve got till the end of day ${DEADLINE}. I’m a patient man.`;
}

/* ---------- Street ---------- */
function streetHTML() {
  const sellers = S.sellers.map(sellerCard).join('');
  const buyers = S.buyers.map(buyerCard).join('');
  return `<section class="del">${avatar('Del', 8)}<div class="txt"><b>Del</b> <span class="muted">· your lender</span><p>${esc(delLine())}</p></div>${S.cleared ? '' : '<button type="button" class="btn" data-act="repay">Pay Del</button>'}</section>
  ${S.starter ? `<div class="starter"><p><b>Your starter pack is waiting.</b> Three free plates to sell or keep.</p><button type="button" class="btn pri" data-act="pack-buy" data-id="starter">Open it now</button></div>` : ''}

  <h2 class="h">Wanted <small>Buyers looking for plates today. One sale each.</small></h2>
  <div class="grid">${buyers}</div>`;

function sellerCard(s) {

    <header class="who">${avatar(s.n, s.hue)}<div><b>${esc(s.n)}</b><small>${esc(s.r)}</small></div></header>
    ${plateHTML(s.t)}
    <div class="meta">${d.fmt} · ${d.when}${d.where ? ' · ' + d.where : ''}</div>
    <dl class="kv"><div><dt>Asking</dt><dd>${gbp(s.counter)}</dd></div><div><dt>Your guess</dt><dd>${gbpS(s.est[0])}–${gbpS(s.est[1])}</dd></div></dl>
    <div class="row">${st}${chk}</div>

function payHint(pm) { return pm < .9 ? 'Under value' : pm < 1.1 ? 'Around value' : pm < 1.3 ? 'Above value' : 'Well above value'; }
function buyerCard(b) {
  const n = S.owned.filter(o => matches(b, o)).length;

/* ---------- Packs ---------- */

/* ---------- Studio ---------- */
const STUDIO_FMT = {
  cur: { l: 'Current', ex: 'BO55 MAN', hint: 'Two letters, two-digit age (02–26 or 51–75), three letters.' },
  pre: { l: 'Prefix', ex: 'S4 RAH', hint: 'A year letter, a number from 1 to 999, three letters.' },
  suf: { l: 'Suffix', ex: 'SAM 1K', hint: 'Three letters, a number from 1 to 999, a year letter.' },
  dl: { l: 'Dateless', ex: 'JIM 7', hint: 'One to three letters and a number from 1 to 9999, either way round.' },
};
function normalize(fmt, raw) {
  const s = String(raw).toUpperCase().replace(/[^A-Z0-9]/g, '');
  let m;
  if (fmt === 'cur' && (m = s.match(/^([A-Z]{2}\d{2})([A-Z]{3})$/))) return m[1] + ' ' + m[2];
  if (fmt === 'pre' && (m = s.match(/^([A-Z]\d{1,3})([A-Z]{3})$/))) return m[1] + ' ' + m[2];
  if (fmt === 'suf' && (m = s.match(/^([A-Z]{3})(\d{1,3}[A-Z])$/))) return m[1] + ' ' + m[2];
  if (fmt === 'dl' && (m = s.match(/^([A-Z]{1,3})(\d{1,4})$/) || s.match(/^(\d{1,4})([A-Z]{1,3})$/))) return m[1] + ' ' + m[2];
  return null;
}
const takenChance = v => clamp(.12 + Math.log10(Math.max(v, 100) / 100) * .2, .12, .96);
function studioQuote(t) {
  const a = appraise(t); if (!a) return null;
  const taken = mulberry32(hash(t + '|' + S.day))() < takenChance(a.v);
  return { a, taken, owned: S.owned.some(o => o.t === a.t), price: roundNice(mv(a.t) * 1.35) + 80 };
}
function studioHTML() {
  if (!UI.ideas.length) studioIdeas();
  const f = STUDIO_FMT[UI.studioFmt];
  return `<h2 class="h">Plate studio <small>Design a plate and register it at the registration office. They charge more than it’s worth, plus an £80 assignment fee.</small></h2>
  <div class="studio">
    <section class="panel">
      <h3>Design</h3>
      <div class="seg" role="group" aria-label="Format">${Object.keys(STUDIO_FMT).map(k => `<button type="button" data-act="studio-fmt" data-v="${k}" aria-pressed="${UI.studioFmt === k}">${STUDIO_FMT[k].l}</button>`).join('')}</div>
      <div class="field"><label for="studio-in">Registration</label><input id="studio-in" maxlength="9" autocomplete="off" spellcheck="false" placeholder="${f.ex}" value="${esc(UI.studioText)}"></div>
      <p class="hint" id="studio-hint">${esc(f.hint)}</p>
      <div class="field"><label>Ideas</label><div class="ideas">${UI.ideas.map(t => `<button type="button" data-act="studio-idea" data-t="${esc(t)}">${esc(t)}</button>`).join('')}<button type="button" data-act="studio-more" aria-label="More ideas">↻</button></div></div>
    </section>
    <section class="panel" id="studio-out" aria-live="polite"></section>
  </div>`;
}
function studioIdeas() {
  const kinds = ['curWord', 'preName', 'sufName', 'dlName', 'curPat', 'dl5'];
  UI.ideas = Array.from({ length: 6 }, (_, i) => { for (let k = 0; k < 20; k++) { const t = GEN[kinds[i]](); if (appraise(t)) return appraise(t).t; } return 'BO55 MAN'; });
}
function studioUpdate() {
  const out = $('#studio-out'); if (!out) return;
  const raw = UI.studioText, f = STUDIO_FMT[UI.studioFmt];
  const t = raw ? normalize(UI.studioFmt, raw) : null;

  if (!q) { out.innerHTML = `<h3>Preview</h3>${plateHTML(raw ? raw.toUpperCase().slice(0, 9) : f.ex)}<p class="hint">Type a registration to see what it’s worth and whether it’s free.</p>`; return; }
  const a = q.a, d = describe(a.p);

  else action = `<button type="button" class="btn pri" data-act="studio-buy" data-t="${esc(a.t)}" ${S.cash >= q.price ? '' : 'disabled'}>${S.cash >= q.price ? `Register for ${gbp(q.price)}` : `Need ${gbp(q.price - S.cash)} more`}</button>`;
  out.innerHTML = `<h3>Preview</h3>${plateHTML(a.t)}

    <dl class="kv"><div><dt>Market value</dt><dd>${gbp(mv(a.t))}</dd></div><div><dt>Office price</dt><dd>${gbp(q.price)}</dd></div></dl>

function tagList(a) {

function buyFrom(s, price) {
  if (S.cash < price) { toast(`You only have ${gbp(S.cash)}.`); return; }
  S.cash -= price; s.state = 'bought'; s.paid = price; s.result = { kind: 'bought', price };
  S.owned.push({ id: nid(), t: s.t, paid: price, day: S.day, dud: s.dodgy, lock: false, auction: false, src: s.n });
  S.stats.bought++;
  log(`Bought ${s.t} from ${s.n}`, -price, s.dodgy ? 'Turned out to be cloned' : '');
  if (s.dodgy) SFX.bad(); else SFX.deal();
}
const SAY = {
  insult: ['Are you having a laugh?', 'Do one. That’s an insult.', 'I’m not giving it away.', 'You’re wasting my time.'],
  far: ['Nowhere near. Try again.', 'You’ll have to do better than that.', 'Come on, be serious.'],
  close: ['Now we’re talking. Meet me a bit higher?', 'Getting warmer.', 'Nearly. Bit more and it’s yours.'],
  yes: ['Go on then. Deal.', 'Done. Pleasure.', 'Shake on it.'],
  walk: ['Forget it. I’ll sell it elsewhere.', 'I’m off. Waste of my afternoon.', 'No deal. Bye.'],
};
function sellerRespond(s, x) {
  x = Math.round(x);
  if (!(x > 0)) { toast('Enter an offer in pounds.'); return; }
  if (x > S.cash) { toast(`You only have ${gbp(S.cash)}.`); return; }
  if (x >= s.counter) { buyFrom(s, s.counter); s.msg = pick(SAY.yes); return; }
  const ratio = x / s.reserve;
  if (x >= s.reserve) {
    const p = .45 + .55 * (x - s.reserve) / Math.max(1, s.counter - s.reserve);
    if (Math.random() < p) { buyFrom(s, x); s.msg = pick(SAY.yes); return; }
    s.counter = Math.max(x + 1, roundNice(s.counter - (s.counter - x) * .5));
    s.pat--; s.msg = `${pick(SAY.close)} ${gbp(s.counter)}?`; s.mood = 'warn';
  } else if (ratio < .55) {
    s.pat -= 2; s.msg = pick(SAY.insult); s.mood = 'bad';
  } else {
    s.counter = Math.max(s.reserve, roundNice(s.counter - (s.counter - x) * rand(.15, .35)));
    s.pat--; s.msg = `${pick(SAY.far)} ${gbp(s.counter)}.`; s.mood = '';
  }
  if (s.pat <= 0) { s.state = 'gone'; s.msg = pick(SAY.walk); s.result = { kind: 'gone' }; SFX.bad(); }
}

function startSell(b, pid) {

  const m = mv(o.t), top = Math.min(b.budget, m * b.pm * (S.upg.tongue ? 1.05 : 1));

  b.deal = { pid: o.id, offer: Math.min(offer, Math.floor(top)), max: Math.floor(top), pat: b.pat, msg: `I’ll give you ${gbp(Math.min(offer, Math.floor(top)))} for it.`, mood: '' };
}
function sellPlate(o, price, via, note) {
  S.cash += price; S.stats.sold++; S.stats.profit += price - o.paid;
  S.owned = S.owned.filter(x => x.id !== o.id);
  log(`Sold ${o.t} ${via}`, price, note || `Paid ${gbp(o.paid)}`);
  SFX.cash();
}
function buyerRespond(b, x) {
  const dl = b.deal, o = S.owned.find(y => y.id === dl.pid);
  x = Math.round(x);
  if (!(x > 0)) { toast('Enter a price in pounds.'); return; }
  if (!o) return;
  const done = price => { dl.result = { kind: 'sold', price, paid: o.paid, t: o.t }; b.state = 'sold'; b.sold = { t: o.t, p: price }; sellPlate(o, price, `to ${b.n}`); dl.msg = pick(['Lovely. Pleasure doing business.', 'Deal. The missus will love it.', 'Done. I’ll transfer it now.']); };
  if (x <= dl.offer) { done(x); return; }
  if (x <= dl.max) {
    const p = .4 + .6 * (dl.max - x) / Math.max(1, dl.max - dl.offer);
    if (Math.random() < p) { done(x); return; }
    dl.offer = Math.min(dl.max, roundNice(dl.offer + (x - dl.offer) * rand(.35, .6)));
    dl.pat--; dl.msg = `Bit steep. I could stretch to ${gbp(dl.offer)}.`; dl.mood = 'warn';
  } else if (x > dl.max * 1.5) {
    dl.pat -= 2; dl.msg = pick(['Behave. I’m not made of money.', 'You’re having me on.', 'Not a chance at that price.']); dl.mood = 'bad';
  } else {
    dl.offer = Math.min(dl.max, roundNice(dl.offer + (dl.max - dl.offer) * rand(.2, .45)));
    dl.pat--; dl.msg = `Too rich for me. ${gbp(dl.offer)}, final-ish.`; dl.mood = '';
  }
  if (dl.pat <= 0) { b.state = 'gone'; dl.result = { kind: 'gone' }; dl.msg = pick(['I’ll look elsewhere, thanks.', 'Forget it. Too much hassle.']); SFX.bad(); }
}

function endDay() {
  if (S.over) return;
  const r = { day: S.day, lines: [] };
  for (const o of S.owned.filter(x => x.auction)) {
    if (Math.random() < .15) { o.auction = false; r.lines.push([`${o.t} didn’t sell at auction`, 0, 'No bids']); log(`${o.t} unsold at auction`, 0); continue; }
    const m = mv(o.t), hammer = roundNice(m * clamp(Math.exp(gauss() * .35), .6, 1.6)), net = Math.round(hammer * (1 - AUCTION_FEE));
    sellPlate(o, net, 'at auction', `Hammer ${gbp(hammer)}, fee ${gbp(hammer - net)}`);
    r.lines.push([`${o.t} sold at auction for ${gbp(hammer)}, less the fee`, net]);
  }
  if (S.cash >= RENT) { S.cash -= RENT; r.lines.push(['Lock-up rent', -RENT]); log('Lock-up rent', -RENT); }
  else { const short = RENT - S.cash; S.cash = 0; S.debt += short; r.lines.push(['Lock-up rent (couldn’t pay, added to debt)', -RENT]); log('Rent added to debt', 0, gbp(short)); }
  if (S.debt > 0 && !S.cleared) {
    const int = Math.round(S.debt * RATE * 100) / 100;
    S.debt = Math.round((S.debt + int) * 100) / 100;
    r.lines.push(['Del’s interest (added to what you owe)', -Math.round(int)]);
  }
  if (!S.cleared && S.day >= DEADLINE && S.debt > 0) { S.over = true; save(); showModal('over'); return; }
  S.day++;
  newTrend(); newStreet();
  S.stats.peak = Math.max(S.stats.peak, S.cash + collectionValue() - S.debt);
  render();
  showModal('day', r);
}
function repay(x) {
  x = Math.min(Math.round(x), S.cash, Math.ceil(S.debt));
  if (!(x > 0)) { toast('Enter an amount you can afford.'); return; }
  S.cash -= x; S.debt = Math.max(0, Math.round((S.debt - x) * 100) / 100);
  log('Paid Del', -x, S.debt > 0 ? `${gbp(S.debt)} still owed` : 'Debt cleared');
  SFX.cash();
  if (S.debt <= 0) { S.debt = 0; S.cleared = S.day; render(); showModal('win'); burstConfetti(); return; }
  toast(`Paid Del ${gbp(x)}. ${gbp(S.debt)} to go.`);
  closeModal();
}

const FX = (() => {
  let cv, g, parts = [], raf = 0;
  function attach(c) { cv = c; g = c.getContext('2d'); size(); }
  function size() { if (!cv) return; const d = Math.min(2, devicePixelRatio || 1); cv.width = innerWidth * d; cv.height = innerHeight * d; g.setTransform(d, 0, 0, d, 0, 0); }
  function burst(x, y, color, n) {
    if (!cv || reduceMotion.matches) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = rand(2, 9);
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3, life: 1, s: rand(3, 7), rot: rand(0, 6), vr: rand(-.3, .3), c: Array.isArray(color) ? pick(color) : color });
    }
    if (!raf) raf = requestAnimationFrame(step);
  }
  function step() {
    g.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life > 0);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.vy += .22; p.vx *= .985; p.rot += p.vr; p.life -= .012;
      g.save(); g.globalAlpha = Math.max(0, p.life); g.fillStyle = p.c; g.translate(p.x, p.y); g.rotate(p.rot); g.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); g.restore();
    }
    raf = parts.length ? requestAnimationFrame(step) : 0;
  }
  addEventListener('resize', size);
  return { attach, burst };
})();
const STAGE_COLORS = ['#9aa5b1', '#46c98e', '#4f9cff', '#b37dff', '#ffae35', '#ff5280'];
function burstConfetti() {
  let c = $('#ov canvas');
  if (!c) { c = document.createElement('canvas'); c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90'; document.body.appendChild(c); setTimeout(() => c.remove(), 4000); }
  FX.attach(c); FX.burst(innerWidth / 2, innerHeight / 3, ['#f7c52a', '#46c98e', '#4f9cff', '#ff5280'], 140);
}

const OPEN = { pack: null, items: [], flipped: 0 };
function buyPack(id) {
  const p = PACKS.find(x => x.id === id); if (!p) return;
  if (p.starter && !S.starter) return;
  if (S.cash < p.price) { toast(`You need ${gbp(p.price - S.cash)} more.`); return; }
  S.cash -= p.price;
  if (p.starter) S.starter = false;
  const ex = ownedSet(), per = Math.round(p.price / p.slots.length);
  const items = p.slots.map(odds => {
    const tier = wpick([0, 1, 2, 3, 4, 5], odds);
    const t = rollPlate(p.pool, tier, ex); ex.add(t);
    const a = appraise(t), o = { id: nid(), t, paid: per, day: S.day, dud: false, lock: false, auction: false, src: p.name };
    S.owned.push(o);
    if (!S.stats.best || a.v > S.stats.best.v) S.stats.best = { t, v: a.v };
    return { o, a };
  });
  S.stats.packs++;
  log(`Opened a ${p.name}`, -p.price, items.map(i => i.a.t).join(', '));
  save();
  OPEN.pack = p; OPEN.items = items; OPEN.flipped = 0;
  const ov = $('#ov');
  ov.innerHTML = `<canvas></canvas><div class="flash"></div>
    <div class="ov-top"><b>${esc(p.name)}</b><span id="ov-msg">Tap the pack to tear it open</span></div>
    <div class="ov-mid"><button type="button" class="pack art-${p.art}" data-act="tear" aria-label="Tear open the ${esc(p.name)}">${packArt(p).replace(/^<div class="pack[^"]*"[^>]*>|<\/div>$/g, '')}</button><div class="cards" hidden></div></div>
    <div class="ov-bot" id="ov-bot"></div>`;
  ov.hidden = false;
  document.documentElement.style.overflow = 'hidden';
  FX.attach($('canvas', ov));
  setTimeout(() => { const b = $('.pack', ov); if (b) b.focus({ preventScroll: true }); }, 50);
}
function tearPack() {
  const ov = $('#ov'), pk = $('.pack', ov);
  if (!pk || pk.classList.contains('tear')) return;
  pk.classList.add('tear'); SFX.rip();
  setTimeout(() => {
    pk.classList.add('gone');
    setTimeout(() => {
      pk.remove();
      const cards = $('.cards', ov);
      cards.innerHTML = OPEN.items.map((it, i) => {
        const tier = it.a.tier, last = i === OPEN.items.length - 1;
        return `<button type="button" class="card${last && tier >= 3 ? ' tease' : ''}${tier === 5 ? ' myth' : ''}" style="--tc:var(--s${tier});animation-delay:${i * 120}ms" data-act="flip" data-i="${i}" aria-label="Reveal plate ${i + 1}">
          <span class="ci"><span class="face back"><span>REG</span></span>
          <span class="face front"><span class="tier" style="--tc:var(--s${tier})">${TIERS[tier].name}</span>${plateHTML(it.a.t)}<span><span class="cv">${gbp(mv(it.a.t))}</span><br><small>${it.a.custom ? 'Custom' : 'Normal'} · ${describe(it.a.p).fmt} · ${describe(it.a.p).when}</small></span></span></span></button>`;
      }).join('');
      cards.hidden = false;
      $('#ov-msg').textContent = 'Tap each plate to flip it';
      $('#ov-bot').innerHTML = `<button type="button" class="btn" data-act="reveal-all">Flip them all</button>`;
    }, reduceMotion.matches ? 0 : 380);
  }, reduceMotion.matches ? 0 : 480);
}
function flipCard(i) {
  const ov = $('#ov'), c = $(`.card[data-i="${i}"]`, ov);
  if (!c || c.classList.contains('flipped')) return;
  c.classList.add('flipped'); c.classList.remove('tease');
  const it = OPEN.items[i], tier = it.a.tier;
  SFX.flip(tier);
  OPEN.flipped++;
  if (tier >= 3) {
    const r = c.getBoundingClientRect();
    setTimeout(() => FX.burst(r.left + r.width / 2, r.top + r.height / 2, STAGE_COLORS[tier], 30 + tier * 20), 250);
  }
  if (tier >= 4 && !reduceMotion.matches) { const f = $('.flash', ov); f.style.setProperty('--tc', STAGE_COLORS[tier]); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
  if (OPEN.flipped === OPEN.items.length) setTimeout(packSummary, 500);
}
function revealAll() {
  OPEN.items.forEach((_, i) => setTimeout(() => flipCard(i), i * 380));
}
function packSummary() {
  const total = OPEN.items.reduce((s, it) => s + mv(it.a.t), 0);
  const commons = OPEN.items.filter(it => it.a.tier === 0 && S.owned.some(o => o.id === it.o.id));
  const cv = commons.reduce((s, it) => s + Math.round(mv(it.a.t) * DEALER), 0);
  const p = OPEN.pack, net = total - p.price;
  $('#ov-msg').textContent = 'All plates are in your garage';
  $('#ov-bot').innerHTML = `<p class="sum">Pack value <b>${gbp(total)}</b> · paid <b>${p.price ? gbp(p.price) : 'nothing'}</b> · <b style="color:${net >= 0 ? 'var(--s1)' : 'var(--s5)'}">${net >= 0 ? '+' : ''}${gbp(net)}</b></p>
    <div class="row" style="justify-content:center">${commons.length ? `<button type="button" class="btn" data-act="pack-sell-commons">Sell commons to the dealer · ${gbp(cv)}</button>` : ''}<button type="button" class="btn pri" data-act="pack-done">Done</button></div>`;
  const bot = $('#ov-bot .btn.pri'); if (bot) bot.focus({ preventScroll: true });
}
function closePack() {
  const ov = $('#ov'); ov.hidden = true; ov.innerHTML = '';
  document.documentElement.style.overflow = '';
  OPEN.pack = null; render();
}

/* Squeeze plate characters to fit the plate, whatever font loaded. */
function fitPlates() {
  $$('.pl .txt').forEach(el => {
    const box = el.parentElement, avail = box.clientWidth - 4;
    if (!avail) return;
    const need = el.scrollWidth;
    el.style.setProperty('--k', need > avail ? (avail / need).toFixed(3) : '1');
  });
}
let fitQ = 0;
const queueFit = () => { if (fitQ) return; fitQ = requestAnimationFrame(() => { fitQ = 0; fitPlates(); }); };
new MutationObserver(queueFit).observe(document.body, { childList: true, subtree: true });
addEventListener('resize', queueFit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(queueFit);

/* ================================================================
   Toast
   ================================================================ */
let toastT = 0;
function toast(s) { const el = $('#toast'); el.textContent = s; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2600); }

/* ================================================================
   Actions
   ================================================================ */
const val = sel => +(($(sel) || {}).value || 0);
const ACT = {
  tab: b => { UI.tab = b.dataset.tab; render(); scrollTo({ top: 0 }); },
  close: () => closeModal(),
  haggle: b => showModal('buy', b.dataset.id),
  'set-offer': b => { $('#offer-in').value = b.dataset.v; },
  offer: b => { const s = sellerById(b.dataset.id); sellerRespond(s, val('#offer-in')); render(); drawModal('#offer-in'); },
  'pay-ask': b => { const s = sellerById(b.dataset.id); buyFrom(s, s.counter); s.msg = pick(SAY.yes); render(); drawModal(); },
  check: b => {
    const s = sellerById(b.dataset.id); if (s.check) return;
    if (!S.upg.hpi) { if (S.cash < CHECK_FEE) { toast(`A check costs ${gbp(CHECK_FEE)}.`); return; } S.cash -= CHECK_FEE; log(`History check on ${s.t}`, -CHECK_FEE); }
    s.check = s.dodgy ? 'dodgy' : 'clean';
    s.msg = s.dodgy ? 'What? That check’s wrong. It’s all legit, I swear.' : (s.type === 'shifty' ? 'Told you it was legit.' : 'Check away, it’s all above board.');
    s.mood = s.dodgy ? 'bad' : 'good';
    if (s.dodgy) SFX.bad(); else SFX.click();
    render(); drawModal();
  },
  walk: b => { const s = sellerById(b.dataset.id); s.state = 'gone'; s.msg = 'Suit yourself.'; closeModal(); },
  'sell-open': b => showModal('sellPick', b.dataset.id),
  'sell-pick': b => { const bu = buyerById(b.dataset.id); startSell(bu, b.dataset.pid); showModal('sell', bu.id); },
  'set-ask': b => { $('#ask-in').value = b.dataset.v; },
  ask: b => { const bu = buyerById(b.dataset.id); buyerRespond(bu, val('#ask-in')); render(); drawModal('#ask-in'); },
  'take-offer': b => { const bu = buyerById(b.dataset.id); buyerRespond(bu, bu.deal.offer); render(); drawModal(); },
  'sell-walk': b => { const bu = buyerById(b.dataset.id); bu.state = 'gone'; bu.deal = null; closeModal(); },
  'goto-garage': () => { UI.tab = 'garage'; closeModal(); },
  detail: b => showModal('detail', b.dataset.id),
  lock: b => { const o = S.owned.find(x => x.id === +b.dataset.id); o.lock = !o.lock; if (o.lock) o.auction = false; render(); drawModal(); },
  auction: b => { const o = S.owned.find(x => x.id === +b.dataset.id); o.auction = !o.auction; toast(o.auction ? `${o.t} goes under the hammer tonight.` : `${o.t} is out of the auction.`); render(); drawModal(); },
  dealer: b => {
    const o = S.owned.find(x => x.id === +b.dataset.id); if (!o) return;
    const price = Math.round(mv(o.t) * DEALER);
    sellPlate(o, price, 'to the dealer'); toast(`Sold ${o.t} to the dealer for ${gbp(price)}.`); closeModal();
  },
  scrap: b => { const o = S.owned.find(x => x.id === +b.dataset.id); S.owned = S.owned.filter(x => x !== o); log(`Scrapped cloned plate ${o.t}`, 0); closeModal(); },
  'sell-commons': () => {
    const list = S.owned.filter(o => !o.lock && !o.auction && !o.dud && appraise(o.t).tier === 0);
    let sum = 0; list.forEach(o => { const p = Math.round(mv(o.t) * DEALER); sum += p; sellPlate(o, p, 'to the dealer'); });
    toast(`Sold ${list.length} plates to the dealer for ${gbp(sum)}.`); render();
  },
  gfilter: b => { UI.gFilter = b.dataset.v; render(); },
  'pack-buy': b => buyPack(b.dataset.id),
  tear: () => tearPack(),
  flip: b => flipCard(+b.dataset.i),
  'reveal-all': b => { b.disabled = true; revealAll(); },
  'pack-done': () => closePack(),
  'pack-sell-commons': b => {
    const ids = new Set(OPEN.items.filter(it => it.a.tier === 0).map(it => it.o.id));
    let sum = 0; S.owned.filter(o => ids.has(o.id)).forEach(o => { const p = Math.round(mv(o.t) * DEALER); sum += p; sellPlate(o, p, 'to the dealer'); });
    b.disabled = true; b.textContent = `Sold for ${gbp(sum)}`; save();
  },
  repay: () => showModal('repay'),
  'set-repay': b => { $('#repay-in').value = b.dataset.v; },
  'repay-go': () => repay(val('#repay-in')),
  endday: () => { if (OPEN.pack) return; endDay(); },
  upgrade: b => {
    const u = UPGRADES.find(x => x.k === b.dataset.k), l = S.upg[u.k], c = u.cost[l];
    if (c == null || S.cash < c) return;
    S.cash -= c; S.upg[u.k]++; log(`Bought ${u.name}${u.cost.length > 1 ? ' ' + (l + 1) : ''}`, -c); SFX.deal();
    toast(`${u.name} upgraded. ${u.k === 'contacts' ? 'More sellers from tomorrow.' : ''}`); render();
  },
  'studio-fmt': b => { UI.studioFmt = b.dataset.v; UI.studioText = ''; render(); },
  'studio-idea': b => { const a = appraise(b.dataset.t); UI.studioFmt = a.p.f; UI.studioText = a.t; render(); },
  'studio-more': () => { studioIdeas(); render(); },
  'studio-buy': b => {
    const q = studioQuote(b.dataset.t); if (!q || q.taken || q.owned || S.cash < q.price) return;
    S.cash -= q.price;
    S.owned.push({ id: nid(), t: q.a.t, paid: q.price, day: S.day, dud: false, lock: false, auction: false, src: 'the registration office' });
    log(`Registered ${q.a.t}`, -q.price, 'Includes the £80 assignment fee');
    SFX.deal(); toast(`${q.a.t} is yours. It’s in your garage.`); render();
  },
  settings: () => { UI.confirmNew = false; showModal('settings'); },
  'set-sound': b => { P.sound = b.dataset.v === '1'; savePrefs(); SFX.click(); drawModal(); },
  'set-plate': b => { P.plate = b.dataset.v; savePrefs(); render(); drawModal(); },
  'set-theme': b => { P.theme = b.dataset.v; savePrefs(); applyTheme(); drawModal(); },
  'new-game': () => { UI.confirmNew = true; drawModal(); },
  'new-no': () => { UI.confirmNew = false; drawModal(); },
  'new-yes': () => { UI.confirmNew = false; newGame(); UI.tab = 'street'; closeModal(); toast('New game. You owe Del £2,000.'); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const f = ACT[b.dataset.act];
  if (f) { e.preventDefault(); f(b, e); }
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && UI.modal && UI.modal.type !== 'over' && UI.modal.type !== 'day' && UI.modal.type !== 'win') closeModal(); });
document.addEventListener('keydown', e => {
  if (!$('#ov').hidden) {
    if (e.key === 'Escape') { if (OPEN.flipped === OPEN.items.length) closePack(); else if ($('.pack', $('#ov'))) tearPack(); else revealAll(); }
    return;
  }
  if (e.key === 'Escape' && UI.modal && UI.modal.type !== 'over') { closeModal(); return; }
  if (e.key === 'Enter' && UI.modal && e.target.tagName === 'INPUT') {
    e.preventDefault();
    const go = { 'offer-in': '[data-act="offer"]', 'ask-in': '[data-act="ask"]', 'repay-in': '[data-act="repay-go"]' }[e.target.id];
    if (go) { const b = $(go, $('#sheet')); if (b && !b.disabled) b.click(); }
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'g-tier') { UI.gTier = e.target.value; render(); }
  if (e.target.id === 'g-sort') { UI.gSort = e.target.value; render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'studio-in') { UI.studioText = e.target.value; studioUpdate(); }
});

function applyTheme() {
  if (P.theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.dataset.theme = P.theme;
}

/* ================================================================
   Boot
   ================================================================ */
function boot(data) {
  const pr = load(PREF_KEY); if (pr) P = Object.assign(P, pr);
  applyTheme();
  const saved = (data && valid(data.S) && data.S) || load(SAVE_KEY);
  if (valid(saved)) { S = saved; if (!S.trend) newTrend(); } else newGame();
  if (data && data.tab) UI.tab = data.tab;
  render();
  if (S.over) showModal('over');
}
window.__rh = { appraise, rollPlate, PACKS, TIERS, mv, state: () => S };
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) { try { hot.snapshot(() => ({ S, tab: UI.tab })); } catch (e) { /* not available */ } }
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
</body>
</html>
